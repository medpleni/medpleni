PAGES.qbank=function(){const tab=state.params.tab||'visao';
 const tabs=`<div class="tabs">${[['visao','Visão geral & cobertura'],['pipeline','Pipeline editorial'],['itens','Explorar itens'],['motores','Motores de produção'],['simulador','Simulador de capacidade'],['qualidade','Qualidade & governança']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('qbank',{tab:'${k}'})">${l}</button>`).join('')}</div>`;
 const F={visao:qbVisao,pipeline:qbPipeline,itens:qbItens,motores:qbMotores,simulador:qbSimulador,qualidade:qbQualidade};
 return `<div class="ph"><div class="t"><div class="eyebrow">Infraestrutura de conteúdo</div><h1>Banco de questões</h1><small>Criação, curadoria, classificação, uso e atualização contínua. <b>Uma questão só conta como disponível quando está classificada, revisada, com direitos registrados e aprovada.</b></small></div><div class="actions"><button class="btn" onclick="toast('Importação de lote (PDF/JSON) enviada ao Motor A — 0 itens até triagem.','ok')">⬆ Importar lote</button><button class="btn primary" onclick="novaQuestao()">+ Nova questão</button></div></div>${tabs}${F[tab]()}`};
function qbVisao(){const pub=BANK.porStatus.publicada;const tot=BANK.total;const emRev=BANK.porStatus.rev_tecnica+BANK.porStatus.rev_pedagogica;
 // cobertura por área × contexto (hipótese: distribuição)
 const cov=AREAS.map(a=>CONTEXTOS.map(cx=>{const comps=COMPS.filter(c=>c.area===a.id&&c.ctx===cx);return comps.length?Math.round(BANK.porArea[a.id]*0.79*(0.28+hsh(a.id+cx)*0.5)/Math.max(1,COMPS.filter(c=>c.area===a.id).length)):Math.round(BANK.porArea[a.id]*0.05*hsh(cx+a.id))}));
 return `<div class="grid g5 mb"><div class="card kpi accent"><div class="lbl">Disponíveis (publicadas)</div><div class="val">${fmt(pub)}</div><div class="delta">${pct(100*pub/tot)} do acervo total de ${fmt(tot)}</div></div><div class="card kpi warn click" onclick="go('qbank',{tab:'pipeline'})"><div class="lbl">Em revisão</div><div class="val">${fmt(emRev)}</div><div class="delta">tempo médio 4,6 dias</div></div><div class="card kpi"><div class="lbl">Produção últimas 4 sem.</div><div class="val">${fmt(BANK.semanal.slice(-4).reduce((a,b)=>a+b,0))}</div><div class="delta up">▲ ritmo ≈ ${fmt(Math.round(BANK.semanal.slice(-4).reduce((a,b)=>a+b,0)*13/12))}/mês</div></div><div class="card kpi danger click" onclick="go('qbank',{tab:'qualidade'})"><div class="lbl">Contestadas / em atualização</div><div class="val">${BANK.porStatus.contestada}<small> / ${BANK.porStatus.atualizacao}</small></div></div><div class="card kpi"><div class="lbl">Taxa de aprovação editorial</div><div class="val">76<small>%</small></div><div class="delta">média ponderada dos motores</div></div></div>
 <div class="grid g-2-1 mb"><div class="card"><div class="ch"><h3>Cobertura: área × contexto de atuação (itens publicados)</h3><span class="hint">lacunas em vermelho</span></div><div class="heat" style="grid-template-columns:170px repeat(6,1fr)"><div></div>${CONTEXTOS.map(c=>`<div class="ht">${c}</div>`).join('')}${AREAS.map((a,i)=>`<div class="hl">${a.nome}</div>`+cov[i].map((v,j)=>{const target=COMPS.some(c=>c.area===a.id&&c.ctx===CONTEXTOS[j])?300:40;const col=v>=target?'#0d8f7c':v>=target*.6?'#8a6a12':'#a63d3d';return `<div class="hc" style="background:${col}" title="${a.nome} × ${CONTEXTOS[j]}: ${v} itens (meta ${target})" onclick="go('qbank',{tab:'itens',area:'${a.id}'})">${fmt(v)}</div>`}).join('')).join('')}</div><p class="note mt8">Meta por célula = 300 itens quando a combinação área × contexto tem competência na matriz; 40 para combinações periféricas. Metas são hipóteses editoriais ajustáveis.</p></div>
 <div class="card"><div class="ch"><h3>Por origem</h3></div><div class="row" style="gap:16px">${donut(ORIGENS.map((o,i)=>({lbl:o.nome,v:BANK.porOrigem[o.id],color:['#0077B6','#6B5CE7','#F5A623','#00C2A8','#22C55E'][i]})),130)}<div class="stat-list" style="flex:1">${ORIGENS.map((o,i)=>`<div class="si"><span><i class="dot" style="background:${['#0077B6','#6B5CE7','#F5A623','#00C2A8','#22C55E'][i]}"></i> ${o.nome.split(' (')[0]}</span><b>${fmt(BANK.porOrigem[o.id])}</b></div>`).join('')}</div></div><div class="callout warn mt"><span>⚠</span><div class="small">Itens de origem IA só entram em provas e simulados após revisão técnica e pedagógica humana. Hoje: ${fmt(Math.round(BANK.porOrigem.ia*.61))} dos ${fmt(BANK.porOrigem.ia)} gerados estão publicados.</div></div></div></div>
 <div class="grid g2"><div class="card"><div class="ch"><h3>Por área de formação</h3><span class="hint">publicadas · meta de proporção da Matriz</span></div>${AREAS.map(a=>barRow(a.nome,100*BANK.porArea[a.id]/Math.max(...Object.values(BANK.porArea)),'  '+fmt(BANK.porArea[a.id]))).join('')}</div><div class="card"><div class="ch"><h3>Produção semanal (itens aprovados)</h3></div>${svgBars(BANK.semanal.map((v,i)=>({lbl:'S'+(i+1),v,color:'#00C2A8'})),{h:160,max:200,ref:150})}<p class="note">Referência tracejada: 150/semana ≈ 600/mês (hipótese da reunião de 12/10).</p></div></div>`}
function qbPipeline(){const cols=['rascunho','triagem','classificada','rev_tecnica','rev_pedagogica','aprovada','publicada'];
 return `<div class="callout info mb"><span>ⓘ</span><div class="small"><b>Ciclo de vida:</b> fonte/produção → extração ou geração → estruturação → deduplicação → proveniência → classificação → revisão técnica → revisão pedagógica → gabarito/justificativa → aprovação → publicação → monitoramento → atualização/retirada. Nem toda questão percorre o mesmo caminho: itens oficiais podem pular a revisão pedagógica integral (amostral); itens de IA nunca pulam etapa.</div></div>
 <div class="pipe">${cols.map(c=>{const its=QUESTOES.filter(q=>q.status===c);return `<div class="col"><h4>${STATUS_LBL[c]}<span class="kanban-count">${its.length}<span class="muted xs"> · ${fmt(BANK.porStatus[c])}</span></span></h4>${its.slice(0,6).map(q=>`<div class="it" onclick="openQuestao('${q.id}')"><b class="mono">${q.id}</b> · ${q.tema}<div class="m"><span style="color:${AREA[q.area].cor}">${q.area}</span><span>${ORIGEM[q.origem].motor}</span><span>${q.dif}</span>${q.origem==='ia'?'<span style="color:#A99EF5">IA</span>':''}</div></div>`).join('')}${its.length>6?`<div class="xs muted" style="text-align:center">+ ${its.length-6} na amostra</div>`:''}${!its.length?'<div class="empty small" style="padding:14px">vazio</div>':''}</div>`}).join('')}</div>
 <div class="grid g3 mt"><div class="card"><div class="ch"><h3>Minha fila de revisão</h3><span class="hint">${userLbl()}</span></div>${QUESTOES.filter(q=>q.status==='rev_tecnica'||q.status==='rev_pedagogica').slice(0,5).map(q=>`<div class="alert-item" onclick="openQuestao('${q.id}')"><span class="badge b-warn">${STATUS_LBL[q.status]}</span><div><div class="ttl mono">${q.id}</div><div class="ds">${q.tema} · ${AREA[q.area].nome} · prazo 3 d</div></div></div>`).join('')}</div><div class="card"><div class="ch"><h3>Tempo médio por etapa</h3></div>${[['Triagem/dedup',0.6],['Classificação',0.9],['Revisão técnica',2.4],['Revisão pedagógica',1.7],['Aprovação',0.5]].map(([l,v])=>barRow(l,v*20,'  '+v+' d')).join('')}</div><div class="card"><div class="ch"><h3>Gargalos</h3></div><div class="callout warn"><span>!</span><div class="small">Revisão técnica concentra 62% do tempo. Sugestão: ampliar revisores em Clínica Médica (fila de 118 itens) e priorizar as lacunas da cobertura.</div></div><button class="btn sm mt" onclick="toast('Convite enviado a 2 revisores (simulado).','ok')">+ Convidar revisor</button></div></div>`}
function qbItens(){const p=state.params;const fa=p.area||'',fo=p.origem||'',fs=p.status||'',fq=p.q||'';let list=QUESTOES.filter(q=>(!fa||q.area===fa)&&(!fo||q.origem===fo)&&(!fs||q.status===fs)&&(!fq||q.tema.toLowerCase().includes(fq.toLowerCase())||q.id.toLowerCase().includes(fq.toLowerCase())||COMP[q.comp].nome.toLowerCase().includes(fq.toLowerCase())));
 const F=(k,v)=>`go('qbank',Object.assign({},state.params,{tab:'itens',${k}:${v}}))`;
 return `<div class="filters"><input class="sel" placeholder="Buscar por tema, competência, ID…" value="${fq}" onkeydown="if(event.key==='Enter')${F('q','this.value')}"><select class="sel" onchange="${F('area','this.value')}"><option value="">Todas as áreas</option>${AREAS.map(a=>`<option value="${a.id}" ${fa===a.id?'selected':''}>${a.nome}</option>`).join('')}</select><select class="sel" onchange="${F('origem','this.value')}"><option value="">Todas as origens</option>${ORIGENS.map(o=>`<option value="${o.id}" ${fo===o.id?'selected':''}>${o.nome}</option>`).join('')}</select><select class="sel" onchange="${F('status','this.value')}"><option value="">Todos os status</option>${STATUS.map(s=>`<option value="${s}" ${fs===s?'selected':''}>${STATUS_LBL[s]}</option>`).join('')}</select><span class="small muted">${list.length} itens (amostra de ${QUESTOES.length}; acervo completo ${fmt(BANK.total)})</span>${(fa||fo||fs||fq)?`<button class="btn xs" onclick="go('qbank',{tab:'itens'})">limpar</button>`:''}</div>
 ${list.length?`<div class="card"><table class="tb"><tr><th>ID</th><th>Tema</th><th>Área</th><th>Competência · contexto</th><th>Origem</th><th>Dific.</th><th>Status</th><th class="num">p</th><th class="num">disc.</th><th class="num">usos</th><th>v</th></tr>${list.map(q=>`<tr class="click" onclick="openQuestao('${q.id}')"><td class="mono">${q.id}</td><td>${q.tema}${q.placeholder?'<span class="sub">item demonstrativo</span>':'<span class="sub">autoral · demo</span>'}</td><td><span class="badge b-mute" style="color:${AREA[q.area].cor}">${q.area}</span></td><td class="small">${COMP[q.comp].nome}<span class="sub">${q.ctx}</span></td><td class="small muted">${ORIGEM[q.origem].nome.split(' (')[0]}</td><td><span class="badge b-mute">${q.dif}</span></td><td><span class="badge ${['publicada','aprovada'].includes(q.status)?'b-ok':q.status==='contestada'?'b-crit':['arquivada'].includes(q.status)?'b-mute':'b-warn'}">${STATUS_LBL[q.status]}</span></td><td class="num">${q.p!=null?q.p.toFixed(2):'—'}</td><td class="num">${q.disc!=null?q.disc.toFixed(2):'—'}</td><td class="num">${q.usos}</td><td class="mono small">v${q.versao}</td></tr>`).join('')}</table></div>`:`<div class="empty"><b>Nenhum item com esses filtros</b>Ajuste os filtros ou crie uma questão nova para esta lacuna.<br><button class="btn sm mt" onclick="novaQuestao()">+ Nova questão</button></div>`}`}
function openQuestao(id){const q=Q[id];if(!q)return;const next={rascunho:'triagem',triagem:'classificada',classificada:'rev_tecnica',rev_tecnica:'rev_pedagogica',rev_pedagogica:'aprovada',aprovada:'publicada',contestada:'atualizacao',atualizacao:'rev_tecnica'}[q.status];
 openModal(`${q.id} · ${q.tema}`,`<div class="row sb mb"><div class="pill-row"><span class="badge b-mute" style="color:${AREA[q.area].cor}">${AREA[q.area].nome}</span><span class="badge b-info">${COMP[q.comp].id} ${COMP[q.comp].nome}</span><span class="badge b-mute">${q.ctx}</span><span class="badge b-mute">${q.dif}</span><span class="badge ${q.origem==='ia'?'b-indigo':'b-teal'}">${ORIGEM[q.origem].nome}</span></div><span class="badge ${['publicada','aprovada'].includes(q.status)?'b-ok':q.status==='contestada'?'b-crit':'b-warn'}">${STATUS_LBL[q.status]} · v${q.versao}</span></div>
 <div class="grid g-2-1"><div><div class="card flat"><p style="font-size:14px">${q.enun}</p><div class="mt">${q.alts.map((a,i)=>`<div class="q-opt ${i===q.gab?'ok':''}"><span class="l">${'ABCD'[i]}</span><span>${a}${i===q.gab?' <span class="badge b-ok">gabarito</span>':''}</span></div>`).join('')}</div><h4 class="mt mb8">Comentário / justificativa</h4><p class="small">${q.com}</p><p class="xs muted mt8">Referência: ${q.ref}</p></div>
 ${q.placeholder?'<div class="callout warn mt"><span>⚠</span><div class="small">Item demonstrativo gerado para popular o protótipo. Não é uma questão real.</div></div>':''}</div>
 <div><h4 class="mb8">Proveniência & direitos</h4><div class="kv"><dt>Fonte</dt><dd>${q.fonte}</dd><dt>Licença</dt><dd>${q.licenca}</dd><dt>Autor</dt><dd>${q.autor}</dd><dt>Criada</dt><dd class="mono">${q.criadaEm}</dd><dt>Revisor</dt><dd>${q.revisor||'<span class="muted">pendente</span>'}</dd><dt>Revisada</dt><dd class="mono">${q.revisadaEm||'—'}</dd><dt>Motor</dt><dd>${ORIGEM[q.origem].motor} · ${ENGINES.find(e=>e.id===ORIGEM[q.origem].motor).nome}</dd></div>
 <h4 class="mt mb8">Desempenho (agregado)</h4>${q.p!=null?`<div class="stat-list"><div class="si"><span>Usos</span><b>${fmt(q.usos)}</b></div><div class="si"><span>p (facilidade)</span><b>${q.p.toFixed(2)}</b></div><div class="si"><span>Discriminação</span><b>${q.disc.toFixed(2)}</b></div><div class="si"><span>Contestações</span><b>${q.contest}</b></div></div>${q.flags.length?`<div class="callout warn mt8"><span>!</span><div class="small">Sinais: ${q.flags.join(', ')}. Amostra ${q.usos<200?'pequena — sinal indicativo':'suficiente para decisão editorial'}.</div></div>`:''}`:'<p class="small muted">Sem respostas registradas (item não publicado).</p>'}
 <h4 class="mt mb8">Histórico</h4><div class="tl"><div class="ev ok"><div class="d">${q.revisadaEm||q.criadaEm}</div><div class="t">${q.revisor?'Revisão: '+q.revisor:'Criação'}</div></div>${q.versao>1?`<div class="ev"><div class="d">2026-10-17</div><div class="t">v${q.versao}: atualização por diretriz</div></div>`:''}<div class="ev mute"><div class="d">${q.criadaEm}</div><div class="t">Ingestão / criação (${q.autor})</div></div></div></div></div>`,
 `<button class="btn" onclick="closeModal()">Fechar</button><button class="btn" onclick="toast('Comentário editorial registrado em ${q.id}.','ok');audit('Comentou ${q.id}')">✎ Comentar</button>${q.status==='publicada'?`<button class="btn danger" onclick="setQStatus('${q.id}','contestada')">⚑ Contestar</button><button class="btn" onclick="setQStatus('${q.id}','atualizacao')">↻ Marcar para atualização</button>`:''}${next&&q.status!=='publicada'?`<button class="btn primary" onclick="setQStatus('${q.id}','${next}')">→ ${STATUS_LBL[next]}</button>`:''}${['rev_tecnica','rev_pedagogica'].includes(q.status)?`<button class="btn danger" onclick="setQStatus('${q.id}','arquivada')">✕ Rejeitar</button>`:''}`,'wide')}
function setQStatus(id,st){const q=Q[id];const old=q.status;q.status=st;if(st==='publicada'&&!q.revisor)q.revisor=userLbl();if(['aprovada','publicada'].includes(st))q.revisadaEm=new Date().toISOString().slice(0,10);if(st==='atualizacao')q.versao++;persist();audit(`${id}: ${STATUS_LBL[old]} → ${STATUS_LBL[st]}`);closeModal();toast(`<b>${id}</b> movida para <b>${STATUS_LBL[st]}</b>.`,st==='arquivada'||st==='contestada'?'warn':'ok');rerender()}
function novaQuestao(){openModal('Nova questão',`<div class="tabs"><button class="on" id="nq-t1" onclick="nqMode('manual')">Autoral (docente)</button><button id="nq-t2" onclick="nqMode('ia')">Assistida por IA (Motor B)</button></div>
 <div id="nq-body">${nqManual()}</div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveQuestao()">Salvar como rascunho</button>`,'wide')}
function nqManual(){return `<div class="grid g3"><div class="fld"><label>Área</label><select id="nq-area">${AREAS.map(a=>`<option value="${a.id}">${a.nome}</option>`).join('')}</select></div><div class="fld"><label>Competência</label><select id="nq-comp">${COMPS.map(c=>`<option value="${c.id}">${c.id} · ${c.nome}</option>`).join('')}</select></div><div class="fld"><label>Dificuldade pretendida</label><select id="nq-dif">${DIFIC.map(d=>`<option>${d}</option>`).join('')}</select></div></div>
 <div class="fld"><label>Tema</label><input id="nq-tema" placeholder="ex.: Depressão na APS"></div><div class="fld"><label>Enunciado (caso clínico)</label><textarea id="nq-enun" placeholder="Descreva o caso e a pergunta…"></textarea></div>
 <div class="grid g2">${'ABCD'.split('').map(l=>`<div class="fld"><label>Alternativa ${l}</label><input id="nq-${l}"></div>`).join('')}</div>
 <div class="grid g2"><div class="fld"><label>Gabarito</label><select id="nq-gab"><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div class="fld"><label>Referência</label><input id="nq-ref" placeholder="Diretriz / consenso / livro-texto (obrigatório)"></div></div>

 <div><div class="card mb"><div class="ch"><h3>Agenda</h3></div><div class="tl">${PROVAS.filter(p=>p.turma.includes(a.turma)&&['publicada','aprovada','em_revisao'].includes(p.status)).map(p=>`<div class="ev"><div class="d">${p.data}</div><div class="t">${p.titulo}</div><div class="x">${p.itens} itens</div></div>`).join('')}${myInterv.map(i=>`<div class="ev ${i.status==='concluida'?'ok':'warn'}"><div class="d">${i.inicio}</div><div class="t">${i.titulo}</div><div class="x">${i.tipo}</div></div>`).join('')}<div class="ev mute"><div class="d">2026-12-14</div><div class="t">Somativa pré-internato</div></div></div></div>
 <div class="card"><div class="ch"><h3>Pontos fortes</h3></div>${strong.map(x=>barRow(x.c.nome,x.s)).join('')}<p class="note mt8">Mantenha com revisões espaçadas; o sistema reinsere itens dessas competências a cada 3 semanas.</p></div></div></div>`;
 if(tab==='comp')body=`<div class="card"><div class="ch"><h3>Competências — ${last.nome}</h3><span class="hint">ordenadas pela maior oportunidade de ganho</span></div><table class="tb"><tr><th>Competência</th><th>Área · contexto</th><th class="num">Você</th><th>Evolução</th><th>Status</th><th>Ação sugerida</th></tr>${comps.map(x=>`<tr><td><b>${x.c.nome}</b></td><td class="small muted">${AREA[x.c.area].nome} · ${x.c.ctx}</td><td class="num"><b>${x.s}</b></td><td>${spark(x.hist.filter(v=>v!=null),x.s<55?'#FF6B6B':'#00C2A8')}</td><td>${x.s>=70?'<span class="badge b-ok">consolidada</span>':x.s>=55?'<span class="badge b-warn">em construção</span>':'<span class="badge b-crit">prioridade</span>'}</td><td>${x.s<55?`<button class="btn xs primary" onclick="go('aluno',{id:'${a.id}',tab:'praticar',comp:'${x.c.id}'})">lista dirigida</button>`:x.s<70?`<button class="btn xs" onclick="toast('Revisão de 10 itens adicionada ao plano.','ok')">+ revisão</button>`:'<span class="xs muted">revisão espaçada automática</span>'}</td></tr>`).join('')}</table><p class="note mt8">Os percentuais mostram acertos nos itens de cada competência; com poucos itens, uma única questão muda muito o número. Use como bússola, não como veredito.</p></div>`;
 if(tab==='avals')body=`<div class="card"><table class="tb"><tr><th>Avaliação</th><th>Data</th><th class="num">Itens</th><th class="num">Seu índice</th><th class="num">Turma</th><th></th></tr>${AVALS.map(v=>{const m=alunoAvg(a,v.id);return `<tr><td><b>${v.nome}</b></td><td class="mono small">${v.data}</td><td class="num">${v.itens}</td><td class="num">${m!=null?Math.round(m):'<span class="muted">não realizada</span>'}</td><td class="num muted">${Math.round(turmaAvg(t.id,v.id))}</td><td>${m!=null?`<button class="btn xs" onclick="revisarAval('${a.id}','${v.id}')">revisar erros</button>`:''}</td></tr>`}).join('')}</table><p class="note mt8">"Revisar erros" abre a prova em modo leitura: sem cronômetro, com a sua alternativa, o gabarito e o comentário. Nunca altera a nota.</p></div>`;
 if(tab==='praticar'){const cid=state.params.comp||weak[0].c.id;const qs=QUESTOES.filter(q=>q.comp===cid&&q.status==='publicada'&&!q.placeholder).concat(QUESTOES.filter(q=>q.comp===cid&&q.status==='publicada'&&q.placeholder)).slice(0,5);const idx=state.params.i||0;const q=qs[idx];
  if(!q)body='<div class="empty"><b>Sem itens publicados para esta competência</b>Volte em breve — o banco é atualizado semanalmente.</div>';
  else{const ans=STU.answered[q.id];body=`<div class="grid g-2-1"><div class="card"><div class="row sb mb"><div><div class="eyebrow">Lista dirigida · ${COMP[cid].nome}</div><h3>Item ${idx+1} de ${qs.length}</h3></div><span class="badge b-mute">${q.dif}</span></div><div class="bar thin mb"><i style="width:${100*(idx)/qs.length}%"></i></div><p style="font-size:14.5px;line-height:1.6">${q.enun}</p><div class="mt">${q.alts.map((al,i)=>`<div class="q-opt ${ans==null?'':i===q.gab?'ok':i===ans?'bad':''}" onclick="${ans==null?`answer('${q.id}',${i})`:''}"><span class="l">${'ABCD'[i]}</span><span>${al}</span></div>`).join('')}</div>
  ${ans!=null?`<div class="callout ${ans===q.gab?'ok':'crit'} mt"><span>${ans===q.gab?'✓':'✕'}</span><div><b>${ans===q.gab?'Correto.':'Não foi dessa vez.'}</b> ${q.com}<div class="xs muted mt8">Referência: ${q.ref}</div></div></div><div class="row mt"><button class="btn" onclick="toast('Flashcard criado a partir deste item (vinculado à competência).','ok')">+ Flashcard</button><button class="btn" onclick="toast('Dúvida enviada ao Preceptor IA com o contexto do item (simulado).')">Perguntar ao Preceptor</button><button class="btn primary" onclick="go('aluno',{id:'${a.id}',tab:'praticar',comp:'${cid}',i:${idx+1<qs.length?idx+1:0}})">${idx+1<qs.length?'Próximo →':'Concluir lista'}</button></div>`:`<div class="row sb mt"><span class="xs muted">Confiança na resposta: <select class="sel" style="padding:3px 6px"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></span><span class="xs muted">sem cronômetro neste modo</span></div>`}</div>
  <div><div class="card mb"><div class="ch"><h3>Por que esta lista</h3></div><p class="small">Seus erros na ${last.nome} se concentraram em: <b>${objFor(cid)[0]}</b>. Esta lista mistura itens desse objetivo com dois outros da mesma competência para evitar memorização de padrão.</p></div><div class="card"><div class="ch"><h3>Sessão</h3></div><div class="stat-list"><div class="si"><span>Respondidos</span><b>${Object.keys(STU.answered).length}</b></div><div class="si"><span>Acertos</span><b>${Object.entries(STU.answered).filter(([id,v])=>Q[id]&&Q[id].gab===v).length}</b></div><div class="si"><span>Competência</span><b>${cid}</b></div></div></div></div></div>`}}
 if(tab==='plano')body=`<div class="grid g-2-1"><div class="card"><div class="ch"><h3>Plano até a somativa pré-internato (14/12)</h3><span class="hint">8 semanas · 6 h/semana</span></div>${[['Sem 1–2','TMC na APS (C10) — lista dirigida 40 itens + revisão de casos','prioridade'],['Sem 3','Epidemiologia (C12) — cálculos e vigilância','atenção'],['Sem 4–5','Urgências clínicas (C02) — sepse, SCA, ácido-base','atenção'],['Sem 6','Revisão espaçada: pontos fortes','manutenção'],['Sem 7','Simulado de 60 itens (todas as competências)','verificação'],['Sem 8','Revisão dos erros do simulado','verificação']].map(([w,x,k])=>`<div class="alert-item"><span class="badge ${k==='prioridade'?'b-crit':k==='atenção'?'b-warn':k==='verificação'?'b-info':'b-ok'}">${w}</span><div><div class="ttl">${x}</div><div class="ds">${k}</div></div><label class="chk" style="margin-left:auto"><input type="checkbox" onchange="toast('Progresso salvo no seu plano.')"></label></div>`).join('')}<div class="row mt"><button class="btn" onclick="toast('Plano reajustado: blocos redistribuídos após atraso (simulado).','ok')">⟳ Reajustar após atraso</button><button class="btn" onclick="toast('Metas enviadas à sua tutora para acordo (simulado).','ok')">Compartilhar com tutora</button></div></div>
 <div><div class="card mb"><div class="ch"><h3>Metas acordadas</h3></div><div class="stat-list"><div class="si"><span>C10 ≥ 60 na próxima prova</span><b>em andamento</b></div><div class="si"><span>Lista dirigida concluída até 10/11</span><b>60%</b></div><div class="si"><span>Encontro com tutora</span><b>28/10</b></div></div></div><div class="card"><div class="callout teal"><span>✦</span><div class="small">O plano é seu. A instituição vê adesão agregada da turma e, com sua tutora, o seu progresso — não há ranking entre colegas.</div></div></div></div></div>`;
 return `<div class="ph"><div class="t"><div class="eyebrow">${t.nome} · ${INST.sigla}</div><h1>Olá, ${a.nome.split(' ')[0]}</h1><small>Seu mapa de aprendizagem: onde você está, o que vem a seguir e por quê.</small></div><div class="actions"><span class="badge b-teal">${last.nome}: ${Math.round(alunoAvg(a,last.id))}</span></div></div>${tabs}${body}`};
function answer(qid,i){STU.answered[qid]=i;rerender()}
function revisarAval(aid_,avId){const a=ALUNOS.find(x=>x.id===aid_);const r=RES[a.id][avId];const qs=QUESTOES.filter(q=>q.status==='publicada'&&!q.placeholder).slice(0,4);
 openModal('Revisão · '+AVAL[avId].nome+' (modo leitura)',`<div class="callout info mb"><span>ⓘ</span><div class="small">Sem cronômetro. Sua alternativa, o gabarito e o comentário. A nota não muda.</div></div>${qs.map((q,i)=>{const mine=i%3===0?q.gab:(q.gab+1)%4;return `<div class="card flat mb8"><div class="row sb"><b class="mono">${q.id}</b><span class="badge ${mine===q.gab?'b-ok':'b-crit'}">${mine===q.gab?'acerto':'erro'}</span></div><p class="small mt8">${q.enun}</p>${q.alts.map((al,j)=>`<div class="q-opt ${j===q.gab?'ok':j===mine?'bad':''}" style="padding:6px 10px;font-size:12.5px"><span class="l">${'ABCD'[j]}</span>${al}</div>`).join('')}<p class="xs muted">${q.com}</p></div>`}).join('')}`,`<button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="closeModal();toast('Flashcards criados para os 2 erros (vinculados a C10 e C12).','ok')">Criar flashcards dos erros</button>`,'wide')}

/* ── 9. GOVERNANÇA & TI ────────────────────────────────── */
PAGES.admin=function(){const tab=state.params.tab||'estrutura';
 const tabs=`<div class="tabs">${[['estrutura','Estrutura acadêmica'],['usuarios','Usuários & papéis'],['perm','Permissões'],['dados','Dados, LGPD & exportação'],['integra','Integrações'],['audit','Auditoria']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('admin',{tab:'${k}'})">${l}</button>`).join('')}</div>`;
 let body='';
 if(tab==='estrutura')body=`<div class="grid g-2-1"><div class="card"><div class="ch"><h3>${INST.nome}</h3><span class="badge b-teal">${INST.contrato}</span></div><div class="kv"><dt>Sigla</dt><dd>${INST.sigla}</dd><dt>Campi</dt><dd>${INST.campi.join(' · ')}</dd><dt>Curso</dt><dd>Medicina (12 períodos)</dd><dt>Turmas ativas</dt><dd>${TURMAS.length}</dd><dt>Estudantes vinculados</dt><dd>${fmt(INST.alunos)}</dd><dt>Docentes/coord.</dt><dd>${DOCENTES.length+3}</dd><dt>Período letivo</dt><dd>2026.2</dd></div><h4 class="mt mb8">Turmas</h4><table class="tb"><tr><th>ID</th><th>Nome</th><th>Período</th><th>Campus</th><th class="num">Matrículas</th><th></th></tr>${TURMAS.map(t=>`<tr><td class="mono">${t.id}</td><td>${t.nome}</td><td>${t.per}º</td><td>${t.campus}</td><td class="num">${t.n}</td><td><button class="btn xs" onclick="toast('Edição de turma (simulada).')">editar</button></td></tr>`).join('')}</table></div>
 <div><div class="card mb"><div class="ch"><h3>Importar matrículas</h3></div><p class="small muted">CSV com matrícula, nome, e-mail, turma. Convites enviados em lote; estudante aceita e define senha.</p><div class="empty small mt8" style="padding:18px">Arraste um CSV ou <a href="#" onclick="event.preventDefault();toast('41 registros validados · 0 erros · convites enfileirados (simulado).','ok');audit('Importou matrículas via CSV')">selecione um arquivo</a></div></div><div class="card"><div class="ch"><h3>Implantação (checklist)</h3></div>${[['Estrutura acadêmica cadastrada',true],['Matrículas importadas (6 turmas)',true],['Docentes convidados (7/10)',false],['Matriz de competências revisada pelo NDE',true],['Diagnóstico de entrada aplicado',true],['Integração SIS (opcional)',false]].map(([l,ok])=>`<label class="chk"><input type="checkbox" ${ok?'checked':''} onchange="toast('Checklist atualizado.')"> ${l}</label>`).join('')}</div></div></div>`;
 if(tab==='usuarios')body=`<div class="card"><div class="ch"><h3>Usuários</h3><button class="btn sm" onclick="toast('Convite enviado (simulado).','ok')">+ Convidar</button></div><table class="tb"><tr><th>Nome</th><th>Papel</th><th>Escopo</th><th>Status</th><th>Último acesso</th><th></th></tr>${Object.entries(USERS).map(([k,u])=>`<tr><td><b>${u.nome}</b></td><td><span class="badge b-info">${ROLE_LABEL[k]}</span></td><td class="small muted">${k==='aluno'?'próprios dados':k==='docente'?'turmas e área atribuídas':k==='tutor'?'estudantes atribuídos':k==='editor'?'banco MedPleni (sem dados pessoais de estudantes)':'instituição'}</td><td><span class="badge b-ok">ativo</span></td><td class="mono small">2026-10-1${Math.floor(hsh(k)*9)}</td><td><button class="btn xs" onclick="toast('Edição de papel (simulada).')">editar</button></td></tr>`).join('')}</table><p class="note mt8">Princípio do menor privilégio: o editor da MedPleni não acessa dados pessoais de estudantes; a instituição não acessa dados de outras instituições (isolamento por tenant + RLS no roadmap P0.4).</p></div>`;
 if(tab==='perm'){const R=['dirigente','coordenador','docente','tutor','aluno','admin'];const M=[['Ver indicadores agregados',['y','y','p','p','n','y']],['Ver dados individuais de estudantes',['n','y','p','p','n','n']],['Criar/editar intervenções',['n','y','y','y','n','n']],['Montar e aprovar provas',['n','y','y','n','n','n']],['Criar/revisar questões',['n','y','y','n','n','n']],['Ver gabaritos antes da aplicação',['n','p','p','n','n','n']],['Exportar matriz aluno × item',['y','y','n','n','n','y']],['Gerir usuários e papéis',['n','n','n','n','n','y']],['Ver trilha de auditoria',['y','n','n','n','n','y']],['Ver próprio desempenho e plano',['—','—','—','—','y','—']]];
  body=`<div class="card"><div class="ch"><h3>Matriz de permissões (simulada na interface)</h3><span class="hint">y = sim · p = parcial (escopo atribuído) · n = não</span></div><div class="perm"><div class="h">Capacidade</div>${R.map(r=>`<div class="h">${ROLE_LABEL[r].split(' (')[0]}</div>`).join('')}${M.map(([l,v])=>`<div>${l}</div>${v.map(x=>`<div class="${x==='y'?'y':x==='p'?'p':'n'}">${x==='y'?'●':x==='p'?'◐':x==='n'?'○':'●'}</div>`).join('')}`).join('')}</div><div class="callout warn mt"><span>⚠</span><div class="small">Controles visuais não são segurança. Em produção, as permissões são aplicadas no banco (RLS por instituição e papel) e em cada endpoint, com testes automatizados.</div></div></div>`}
 if(tab==='dados')body=`<div class="grid g2"><div class="card"><div class="ch"><h3>LGPD & privacidade</h3></div><div class="stat-list"><div class="si"><span>Base legal</span><b>execução de contrato + legítimo interesse educacional</b></div><div class="si"><span>Controlador / operador</span><b>instituição / MedPleni</b></div><div class="si"><span>Isolamento entre instituições</span><b>tenant + RLS</b></div><div class="si"><span>Retenção após desligamento</span><b>24 meses (configurável)</b></div><div class="si"><span>Exclusão a pedido</span><b>fluxo com registro</b></div><div class="si"><span>Dados usados para melhoria do banco</span><b>apenas agregados e anonimizados</b></div><div class="si"><span>Indicadores individuais</span><b>nunca expostos publicamente</b></div></div><button class="btn sm mt" onclick="toast('Relatório de impacto (RIPD) gerado — modelo (simulado).','ok')">Gerar RIPD (modelo)</button></div>
 <div class="card"><div class="ch"><h3>Exportação auditável</h3></div><p class="small muted">Qualquer indicador da plataforma deve ser reproduzível fora dela. A exportação inclui os 6 blocos do pacote mínimo: coorte, aplicação/tentativa, questão/currículo, alternativa marcada (com mapa de embaralhamento), gabarito/correção e adicionais (tempo, confiança).</p><div class="row mt"><select class="sel">${AVALS.map(a=>`<option>${a.nome}</option>`).join('')}</select><button class="btn primary" onclick="toast('CSV + dicionário de dados + hash sha256 gerados (simulado).','ok');audit('Exportação auditável solicitada')">⬇ Exportar</button></div><div class="mt small"><b>Segurança das avaliações:</b> gabaritos cifrados até a publicação; caderno fixo versionado; logs de acesso ao gabarito; versões embaralhadas por sala.</div></div></div>`;
 if(tab==='integra')body=`<div class="grid g3">${[['Sistema acadêmico (Lyceum / TOTVS / RM)','Importação de matrículas e turmas; exportação de notas','planejado'],['LMS (Moodle / Canvas) — LTI 1.3','Abrir avaliações e listas dentro do LMS','planejado'],['SSO (Google Workspace / Microsoft)','Login institucional','piloto'],['Leitura óptica de folhas de resposta','Correção de provas presenciais','piloto'],['API de dados (somente leitura)','BI próprio da instituição','planejado'],['Webhooks','Eventos: prova publicada, resultado disponível','planejado']].map(([n,d,s])=>`<div class="card"><h4>${n}</h4><p class="small muted mt8">${d}</p><span class="badge ${s==='piloto'?'b-teal':'b-mute'}">${s}</span></div>`).join('')}</div><p class="note mt">Nenhum concorrente de preparação ENAMED pesquisado documenta integração com sistema acadêmico; é uma lacuna de mercado, mas depende de validação com a TI das instituições.</p>`;
 if(tab==='audit')body=`<div class="card"><div class="ch"><h3>Trilha de auditoria</h3><span class="hint">ações relevantes · imutável</span></div><table class="tb"><tr><th>Quando</th><th>Quem</th><th>Ação</th></tr>${AUDIT.slice(0,25).map(x=>`<tr><td class="mono small">${x.t}</td><td class="small">${x.u}</td><td class="small">${x.a}</td></tr>`).join('')}</table></div>`;
 return `<div class="ph"><div class="t"><div class="eyebrow">Administração institucional</div><h1>Governança & TI</h1><small>Estrutura, acessos, dados e integrações. Implantação guiada; suporte MedPleni durante o piloto.</small></div></div>${tabs}${body}`};
