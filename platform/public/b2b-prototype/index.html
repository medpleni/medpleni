<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedPleni Institucional — Protótipo B2B</title>
<meta name="description" content="Protótipo navegável da camada institucional do MedPleni (inteligência educacional para escolas médicas). Dados 100% fictícios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   MedPleni Design Tokens — conferidos em platform/app/globals.css
   (fundo profundo #0A0E18, cards #131B2C, pulso #00C2A8, resid #0077B6)
   ═══════════════════════════════════════════════════════════ */
:root{
  --abismo:#0A0E18; --abismo-surface:#101626; --petroleo:#141C2E; --deeper:#070A10;
  --card-bg:#131B2C; --card-border:rgba(90,125,175,.25); --sinal:rgba(78,110,155,.28); --border-subtle:rgba(78,110,155,.18);
  --neblina:#E2E8F0; --chumbo:#94A3B8; --muted:rgba(148,163,184,.7); --heading:#FFFFFF;
  --pulso:#00C2A8; --pulso-light:#33DEC7; --pulso-dim:rgba(0,194,168,.12);
  --resid:#0077B6; --resid-light:#64B5E8; --resid-dim:rgba(0,119,182,.16);
  --indigo:#6B5CE7; --indigo-light:#A99EF5; --ambar:#C98A0A;
  --danger:#FF6B6B; --danger-bg:rgba(255,107,107,.12);
  --warn:#F5A623; --warn-bg:rgba(245,166,35,.12);
  --success:#22C55E; --success-bg:rgba(34,197,94,.12);
  --input-bg:#0C1220; --input-border:rgba(90,125,175,.3); --pill-bg:rgba(43,58,82,.5);
  --sidebar-bg:#0A0E18; --topbar-bg:rgba(10,14,24,.92);
  --r-sm:4px; --r-md:8px; --r-lg:10px; --r-xl:14px;
  --font-display:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;
  --font-ui:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
  --sidebar-w:248px;
}

:root{--callout-warn:#f7d08a;--callout-crit:#ffb3b3;--callout-info:#b9dcf2;--callout-ok:#a7e9bd;--callout-teal:#9fe8dc;--heat-empty:#1b2436;--grid:rgba(78,110,155,.18)}
/* ── Tema claro — tokens copiados de platform/app/globals.css ([data-theme="light"]) ── */
[data-theme="light"]{
  --abismo:#F4F7FB; --abismo-surface:#EAEEF5; --petroleo:#FFFFFF; --deeper:#E2E8F0;
  --sinal:#E2E8F0; --border-subtle:#CBD5E1;
  --neblina:#0F172A; --chumbo:#475569; --muted:#64748B; --heading:#090D16;
  --card-bg:#FFFFFF; --card-border:#E2E8F0; --sidebar-bg:#FFFFFF; --topbar-bg:rgba(255,255,255,.95);
  --input-bg:#F8FAFC; --input-border:#CBD5E1; --pill-bg:#EDF2F7;
  --pulso:#008F7C; --pulso-light:#00A893; --pulso-dim:rgba(0,143,124,.1);
  --resid:#0284C7; --resid-light:#0369A1; --resid-dim:rgba(2,132,199,.1);
  --indigo:#5B4DF0; --indigo-light:#4338CA; --ambar:#B45309;
  --danger:#DC2626; --danger-bg:rgba(220,38,38,.08); --warn:#D97706; --warn-bg:rgba(217,119,6,.08);
  --success:#16A34A; --success-bg:rgba(22,163,74,.08);
  --callout-warn:#92400E; --callout-crit:#991B1B; --callout-info:#075985; --callout-ok:#166534; --callout-teal:#065F55;
  --heat-empty:#E2E8F0; --grid:rgba(71,85,105,.18);
  color-scheme:light;
}
[data-theme="light"] .card{box-shadow:0 2px 8px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.03)}
[data-theme="light"] .brand .logo{color:#fff}
[data-theme="light"] .btn.primary{color:#fff}
[data-theme="light"] .steps .st.on .n{color:#fff}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:#CBD5E1}
[data-theme="light"] .heat .hc{color:#fff}
[data-theme="light"] .toast{background:#fff;color:var(--neblina)}
[data-theme="light"] .modal{box-shadow:0 30px 80px rgba(15,23,42,.25)}
[data-theme="light"] .drawer{box-shadow:-20px 0 60px rgba(15,23,42,.15)}
[data-theme="light"] .tb tr:hover td{background:rgba(2,132,199,.05)}
[data-theme="light"] .nav a:hover{background:var(--abismo-surface)}
.theme-btn{width:36px;height:36px;border-radius:var(--r-md);background:var(--input-bg);border:1px solid var(--sinal);display:grid;place-items:center;color:#F5A623;transition:.15s}
.theme-btn:hover{border-color:var(--pulso)}
[data-theme="light"] .theme-btn{color:#6B5CE7}
.theme-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html{transition:background-color .2s ease,color .2s ease}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--abismo);color:var(--neblina);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--heading);font-weight:600;letter-spacing:.01em;line-height:1.15}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}h4{font-size:15px}
.mono{font-family:var(--font-mono)}
a{color:var(--pulso)}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1f2a40;border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* ── Layout ─────────────────────────────── */
#app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:56px 1fr;height:100vh}
.sidebar{grid-row:1/3;background:var(--sidebar-bg);border-right:1px solid var(--sinal);display:flex;flex-direction:column;overflow:hidden}
.topbar{grid-column:2;background:var(--topbar-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--sinal);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:20}
.main{grid-column:2;overflow:auto;padding:22px 26px 60px;position:relative}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--border-subtle)}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--pulso),var(--resid));display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#06111a;font-size:17px}
.brand .name{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--heading);line-height:1}
.brand .sub{font-size:10.5px;color:var(--chumbo);letter-spacing:.14em;text-transform:uppercase;font-family:var(--font-mono);margin-top:3px}
.inst-switch{margin:12px 14px 6px;padding:10px 12px;background:var(--abismo-surface);border:1px solid var(--border-subtle);border-radius:var(--r-md);font-size:12px}
.inst-switch b{display:block;font-size:12.5px;color:var(--heading)}
.inst-switch span{color:var(--chumbo);font-size:11px}
.nav{flex:1;overflow:auto;padding:8px 10px}
.nav .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 10px 5px;font-family:var(--font-mono)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);color:var(--chumbo);text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:1px;border:1px solid transparent}
.nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--abismo-surface);color:var(--neblina)}
.nav a.active{background:var(--pulso-dim);color:var(--pulso);border-color:rgba(0,194,168,.25)}
.nav a .cnt{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;background:var(--pill-bg);padding:1px 7px;border-radius:10px;color:var(--chumbo)}
.nav a.active .cnt{background:rgba(0,194,168,.2);color:var(--pulso)}
.nav a.locked{opacity:.45}
.sidebar .foot{padding:10px 14px;border-top:1px solid var(--border-subtle);font-size:11px;color:var(--muted)}
.demo-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;background:var(--warn-bg);color:var(--warn);font-size:11px;font-family:var(--font-mono);border:1px solid rgba(245,166,35,.3)}
.role-switch{display:flex;align-items:center;gap:8px;margin-left:auto}
.role-switch select,.sel{background:var(--input-bg);border:1px solid var(--input-border);color:var(--neblina);border-radius:var(--r-md);padding:6px 10px;font-size:13px;font-family:inherit}
.topbar .crumb{color:var(--chumbo);font-size:13px}
.topbar .crumb b{color:var(--heading);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--r-md);padding:5px 10px;width:300px}
.search input{background:transparent;border:0;color:var(--neblina);outline:0;width:100%;font-family:inherit;font-size:13px}
.iconbtn{background:transparent;border:1px solid var(--input-border);color:var(--chumbo);border-radius:var(--r-md);width:34px;height:34px;display:grid;place-items:center}
.iconbtn:hover{color:var(--heading);border-color:var(--pulso)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--resid-dim);color:var(--resid-light);display:grid;place-items:center;font-weight:600;font-size:12px;border:1px solid rgba(100,181,232,.3)}

/* ── Page header ───────────────────────── */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph .t small{display:block;color:var(--chumbo);font-size:12.5px;margin-top:4px;max-width:720px}
.ph .eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pulso);margin-bottom:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── Buttons ───────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-md);border:1px solid var(--input-border);background:var(--abismo-surface);color:var(--neblina);font-size:13px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--pulso);color:var(--heading)}
.btn.primary{background:var(--pulso);color:#06111a;border-color:var(--pulso);font-weight:600}
.btn.primary:hover{background:var(--pulso-light)}
.btn.resid{background:var(--resid);border-color:var(--resid);color:#fff}
.btn.danger{color:var(--danger);border-color:rgba(255,107,107,.35)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Cards / grid ───────────────────────── */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}.g-1-2{grid-template-columns:1fr 2fr}.g-3-2{grid-template-columns:3fr 2fr}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r-xl);padding:16px 18px;box-shadow:0 4px 20px rgba(0,0,0,.35)}
.card.flat{box-shadow:none}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card .ch h3{font-size:16px}
.card .ch .hint{font-size:11.5px;color:var(--muted)}
.kpi{padding:14px 16px}
.kpi .lbl{font-size:11.5px;color:var(--chumbo);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono)}
.kpi .val{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--heading);margin:4px 0 2px;line-height:1}
.kpi .val small{font-size:14px;color:var(--chumbo);font-weight:500}
.kpi .delta{font-size:12px;color:var(--chumbo)}
.kpi .delta.up{color:var(--success)}.kpi .delta.down{color:var(--danger)}
/* bordas laterais coloridas dos KPIs removidas a pedido (19/10) */
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--pulso)}

/* ── Badges / tags ─────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--font-mono);letter-spacing:.02em;white-space:nowrap}
.b-ok{background:var(--success-bg);color:var(--success)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-crit{background:var(--danger-bg);color:var(--danger)}
.b-info{background:var(--resid-dim);color:var(--resid-light)}
.b-teal{background:var(--pulso-dim);color:var(--pulso)}
.b-indigo{background:rgba(107,92,231,.18);color:var(--indigo-light)}
.b-mute{background:var(--pill-bg);color:var(--chumbo)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--pill-bg);color:var(--chumbo);font-size:11px;margin:2px 3px 2px 0}

/* ── Tables ─────────────────────────────── */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--chumbo);font-family:var(--font-mono);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--sinal);white-space:nowrap}
.tb td{padding:9px 10px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
.tb tr:hover td{background:rgba(78,110,155,.07)}
.tb tr.click{cursor:pointer}
.tb td.num,.tb th.num{text-align:right;font-family:var(--font-mono)}
.tb th.sortable{cursor:pointer}.tb th.sortable:hover{color:var(--heading)}
.tb .sub{display:block;font-size:11.5px;color:var(--muted)}

/* ── Forms ─────────────────────────────── */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:12px;color:var(--chumbo);font-weight:500}
.fld input,.fld select,.fld textarea{background:var(--input-bg);border:1px solid var(--input-border);color:var(--neblina);border-radius:var(--r-md);padding:8px 10px;font-family:inherit;font-size:13px;outline:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pulso)}
.fld textarea{min-height:80px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
.chk input{accent-color:var(--pulso)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .sel{min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 11px;border-radius:20px;border:1px solid var(--input-border);background:transparent;color:var(--chumbo);font-size:12px}
.chip.on{background:var(--pulso-dim);border-color:var(--pulso);color:var(--pulso)}

/* ── Tabs ──────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--sinal);margin-bottom:16px;overflow:auto}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--chumbo);padding:9px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--pulso);border-bottom-color:var(--pulso)}
.tabs button:hover{color:var(--heading)}

/* ── Progress / bars ────────────────────── */
.bar{height:7px;background:var(--pill-bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pulso);border-radius:6px}
.bar.thin{height:4px}
.bar i.warn{background:var(--warn)}.bar i.crit{background:var(--danger)}.bar i.ok{background:var(--success)}.bar i.resid{background:var(--resid)}
.rowbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px}
.rowbar .n{text-align:right;font-family:var(--font-mono);color:var(--chumbo)}

/* ── Heatmap ───────────────────────────── */
.heat{display:grid;gap:4px}
.heat .hc{height:38px;border-radius:6px;display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;cursor:pointer;color:#fff;transition:.1s;border:1px solid transparent}
.heat .hc:hover{border-color:#fff;transform:scale(1.04)}
.heat .hl{font-size:11.5px;color:var(--chumbo);display:flex;align-items:center;padding-right:6px;white-space:nowrap}
.heat .ht{font-size:10.5px;color:var(--chumbo);text-align:center;font-family:var(--font-mono);padding-bottom:4px;line-height:1.1}

/* ── Alerts / callouts ─────────────────── */
.callout{border-radius:var(--r-lg);padding:12px 14px;font-size:13px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.callout.warn{background:var(--warn-bg);border-color:rgba(245,166,35,.3);color:var(--callout-warn)}
.callout.crit{background:var(--danger-bg);border-color:rgba(255,107,107,.3);color:var(--callout-crit)}
.callout.info{background:var(--resid-dim);border-color:rgba(100,181,232,.3);color:var(--callout-info)}
.callout.ok{background:var(--success-bg);border-color:rgba(34,197,94,.3);color:var(--callout-ok)}
.callout.teal{background:var(--pulso-dim);border-color:rgba(0,194,168,.3);color:var(--callout-teal)}
.callout b{color:inherit;font-weight:700}
.alert-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border-subtle);cursor:pointer}
.alert-item:last-child{border-bottom:0}
.alert-item:hover .ttl{color:var(--pulso)}
.alert-item .ttl{font-weight:600;color:var(--heading);font-size:13px}
.alert-item .ds{font-size:12px;color:var(--chumbo)}

/* ── Timeline / steps ──────────────────── */
.steps{display:flex;gap:0;align-items:center;margin-bottom:18px;overflow:auto}
.steps .st{display:flex;align-items:center;gap:8px;padding:8px 12px;color:var(--chumbo);font-size:12.5px;white-space:nowrap;cursor:pointer}
.steps .st .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--input-border);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px}
.steps .st.on{color:var(--heading)}.steps .st.on .n{background:var(--pulso);color:#06111a;border-color:var(--pulso)}
.steps .st.done .n{background:var(--success-bg);color:var(--success);border-color:var(--success)}
.steps .sep{width:28px;height:1px;background:var(--sinal);flex:none}
.pipe{display:flex;gap:8px;overflow:auto;padding-bottom:6px}
.pipe .col{min-width:210px;flex:1;background:var(--abismo-surface);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:10px}
.pipe .col h4{font-size:12.5px;display:flex;justify-content:space-between;color:var(--chumbo);margin-bottom:8px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em}
.pipe .it{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r-md);padding:9px 10px;margin-bottom:7px;font-size:12.5px;cursor:pointer}
.pipe .it:hover{border-color:var(--pulso)}
.pipe .it .m{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--sinal)}
.tl .ev{position:relative;padding:4px 0 14px}
.tl .ev:before{content:"";position:absolute;left:-19px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--pulso);border:2px solid var(--abismo)}
.tl .ev.warn:before{background:var(--warn)}.tl .ev.crit:before{background:var(--danger)}.tl .ev.ok:before{background:var(--success)}.tl .ev.mute:before{background:var(--chumbo)}
.tl .ev .d{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.tl .ev .t{font-weight:600;color:var(--heading);font-size:13px}
.tl .ev .x{font-size:12.5px;color:var(--chumbo)}

/* ── Modal / drawer / toast ────────────── */
.ov{position:fixed;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.modal{background:var(--petroleo);border:1px solid var(--card-border);border-radius:var(--r-xl);width:min(880px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(1100px,100%)}
.modal.narrow{width:min(560px,100%)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--sinal);position:sticky;top:0;background:var(--petroleo);z-index:2}
.modal .mb{padding:18px 20px}

<script>
/* ═══════════════════════════════════════════════════════════
   PARTE 1 — DADOS SIMULADOS (todos fictícios, gerados com seed)
   ═══════════════════════════════════════════════════════════ */
// RNG determinístico (mulberry32) → dados reproduzíveis
function mkRng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng=mkRng(20261019);
const rnd=(a,b)=>a+rng()*(b-a);
const rndn=(m,s)=>{let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(rng()*a.length)];
const r1=x=>Math.round(x*10)/10;
const hsh=str=>{let h=0;for(const ch of String(str))h=(h*31+ch.charCodeAt(0))>>>0;return (h%1000)/1000};
const pct=x=>Math.round(x)+'%';
const fmt=n=>n.toLocaleString('pt-BR');

const INST={nome:'Faculdade de Medicina Vale do Ipê',sigla:'FAMVI',cidade:'Ipêlândia (fictícia)',campi:['Campus Centro','Campus Norte'],vagas:120,alunos:0,conceitoDemo:'2 (fictício)',
  contrato:'Plano Institucional · piloto 2026.2'};

// Taxonomia — 7 áreas de formação e 6 contextos conforme Matriz de Referência Comum (Portaria Inep 478/2025, nomenclatura via fontes secundárias; conferir texto oficial)
const AREAS=[
 {id:'CM',nome:'Clínica Médica',cor:'#0077B6'},
 {id:'CG',nome:'Cirurgia Geral',cor:'#6B5CE7'},
 {id:'GO',nome:'Ginecologia e Obstetrícia',cor:'#D96AA7'},
 {id:'PED',nome:'Pediatria',cor:'#F5A623'},
 {id:'MFC',nome:'Medicina de Família e Comunidade',cor:'#22C55E'},
 {id:'SM',nome:'Saúde Mental',cor:'#FF6B6B'},
 {id:'SC',nome:'Saúde Coletiva',cor:'#00C2A8'}];
const AREA=Object.fromEntries(AREAS.map(a=>[a.id,a]));
const CONTEXTOS=['Atenção Primária','Urgência e Emergência','Materno-Infantil','Atenção Psicossocial','Doenças Crônicas','Reabilitação'];
// Competências da matriz INSTITUCIONAL (fictícia), cada uma mapeada a área/contexto da Matriz de Referência.
// Nota: o nº oficial de competências da Matriz Inep não foi confirmado em fonte primária — este é um mapa institucional de demonstração.
const COMPS=[
 {id:'C01',nome:'Cuidado da pessoa adulta com doença crônica',area:'CM',ctx:'Doenças Crônicas',per:[5,6,7,9]},
 {id:'C02',nome:'Urgências clínicas do adulto',area:'CM',ctx:'Urgência e Emergência',per:[7,8,11]},
 {id:'C03',nome:'Abdome agudo e trauma',area:'CG',ctx:'Urgência e Emergência',per:[7,8,10]},

 {id:'C05',nome:'Pré-natal e parto de risco habitual',area:'GO',ctx:'Materno-Infantil',per:[6,8,11]},
 {id:'C06',nome:'Saúde da mulher na atenção primária',area:'GO',ctx:'Atenção Primária',per:[4,6,9]},
 {id:'C07',nome:'Puericultura, crescimento e desenvolvimento',area:'PED',ctx:'Materno-Infantil',per:[4,6,9]},
 {id:'C08',nome:'Urgências pediátricas',area:'PED',ctx:'Urgência e Emergência',per:[8,11]},
 {id:'C09',nome:'Cuidado longitudinal e coordenação na APS',area:'MFC',ctx:'Atenção Primária',per:[2,4,6,9]},
 {id:'C10',nome:'Transtornos mentais comuns na APS',area:'SM',ctx:'Atenção Psicossocial',per:[4,6,8]},
 {id:'C11',nome:'Crise e urgência psiquiátrica',area:'SM',ctx:'Atenção Psicossocial',per:[8,11]},
 {id:'C12',nome:'Epidemiologia, vigilância e indicadores',area:'SC',ctx:'Atenção Primária',per:[2,4,8]},
 {id:'C13',nome:'Políticas de saúde, SUS e gestão',area:'SC',ctx:'Atenção Primária',per:[2,4,12]},
 {id:'C14',nome:'Reabilitação e cuidados paliativos',area:'CM',ctx:'Reabilitação',per:[8,10,12]}];
const COMP=Object.fromEntries(COMPS.map(c=>[c.id,c]));
// Objetivos educacionais ilustrativos por competência (3 cada) — usados no diagnóstico de lacunas
const OBJ={C10:['Rastrear depressão e ansiedade com instrumentos validados na APS','Indicar e titular ISRS no primeiro episódio depressivo','Reconhecer risco de suicídio e estruturar plano de segurança'],
 C12:['Calcular e interpretar incidência, prevalência e letalidade','Interpretar medidas de associação (RR, OR) e vieses','Notificar agravos e aplicar fluxos de vigilância'],
 C02:['Abordagem inicial da sepse e choque','Manejo da síndrome coronariana aguda','Distúrbios ácido-base e hidroeletrolíticos'],
 C11:['Manejo da agitação psicomotora','Avaliação do risco de suicídio na emergência','Intoxicação e abstinência de álcool'],
 C13:['Princípios e diretrizes do SUS','Financiamento e regionalização','Atenção Primária como ordenadora da rede'],
 C05:['Rotina de pré-natal de risco habitual','Síndromes hipertensivas da gestação','Assistência ao parto e puerpério']};
const objFor=c=>OBJ[c]||['Objetivo educacional 1 (demonstrativo)','Objetivo educacional 2 (demonstrativo)','Objetivo educacional 3 (demonstrativo)'];

const DOCENTES=[
 {id:'d1',nome:'Profa. Dra. Helena Vasconcelos',area:'SM',papel:'Docente · Coord. de Saúde Mental'},
 {id:'d2',nome:'Prof. Dr. Ricardo Tavares',area:'CM',papel:'Docente · Clínica Médica'},
 {id:'d3',nome:'Profa. Dra. Mônica Albuquerque',area:'SC',papel:'Docente · Saúde Coletiva'},
 {id:'d4',nome:'Prof. Dr. Caio Fontoura',area:'CG',papel:'Docente · Cirurgia'},
 {id:'d5',nome:'Profa. Dra. Letícia Barreto',area:'PED',papel:'Docente · Pediatria'},
 {id:'d6',nome:'Prof. Dr. Antônio Sá Peixoto',area:'GO',papel:'Docente · GO'},
 {id:'d7',nome:'Profa. Dra. Juliana Mendonça',area:'MFC',papel:'Docente · MFC · Tutora'}];
const USERS={
 dirigente:{nome:'Dra. Regina Duarte Sampaio',papel:'Diretora Acadêmica',ini:'RD'},
 coordenador:{nome:'Prof. Dr. Marcos Vilela',papel:'Coordenador do Curso',ini:'MV'},
 avaliacao:{nome:'Profa. Dra. Paula Figueira',papel:'Coord. de Avaliação / NDE',ini:'PF'},
 docente:{nome:'Profa. Dra. Helena Vasconcelos',papel:'Docente · Saúde Mental',ini:'HV'},
 tutor:{nome:'Profa. Dra. Juliana Mendonça',papel:'Tutora acadêmica',ini:'JM'},
 aluno:{nome:'Ana Beatriz Lourenço',papel:'Estudante · 8º período',ini:'AL'},
 admin:{nome:'Carlos Eduardo Nunes',papel:'Administrador institucional (TI)',ini:'CN'},
 editor:{nome:'Dr. Bruno F. (MedPleni)',papel:'Editor-chefe do banco (MedPleni)',ini:'BF'}};
const ROLE_LABEL={dirigente:'Dirigente (Diretoria)',coordenador:'Coordenação do curso',avaliacao:'Coord. de avaliação / NDE',docente:'Docente',tutor:'Tutor(a)',aluno:'Estudante',admin:'Admin institucional / TI',editor:'Editor do banco (MedPleni)'};

// Turmas
const TURMAS=[
 {id:'T4A',nome:'4º período · A',per:4,n:52,campus:'Campus Centro'},
 {id:'T6A',nome:'6º período · A',per:6,n:49,campus:'Campus Centro'},
 {id:'T8A',nome:'8º período · A',per:8,n:47,campus:'Campus Centro'},
 {id:'T8B',nome:'8º período · B',per:8,n:45,campus:'Campus Norte'},
 {id:'T10A',nome:'10º período · A (internato)',per:10,n:44,campus:'Campus Centro'},
 {id:'T12A',nome:'12º período · A (concluintes)',per:12,n:41,campus:'Campus Centro'}];
const TURMA=Object.fromEntries(TURMAS.map(t=>[t.id,t]));
// Competências avaliáveis por período (introduzida até aquele período)
const compsForPer=p=>COMPS.filter(c=>c.per[0]<=p);

// Avaliações (linha do tempo 2026)
const AVALS=[
 {id:'A1',nome:'Diagnóstico de entrada',tipo:'diagnostico',data:'2026-02-16',mes:'fev',itens:60},
 {id:'A2',nome:'Prova ordinária · 1º bimestre',tipo:'prova',data:'2026-04-20',mes:'abr',itens:80},
 {id:'A3',nome:'Simulado ENAMED institucional',tipo:'simulado',data:'2026-06-15',mes:'jun',itens:100},
 {id:'A4',nome:'Prova ordinária · 2º bimestre',tipo:'prova',data:'2026-08-24',mes:'ago',itens:80},
 {id:'A5',nome:'Avaliação de progresso',tipo:'progresso',data:'2026-10-05',mes:'out',itens:60}];
const AVAL=Object.fromEntries(AVALS.map(a=>[a.id,a]));

// Vieses por turma × competência (história da demo)
const BIAS={};
TURMAS.forEach(t=>{BIAS[t.id]={};COMPS.forEach(c=>{BIAS[t.id][c.id]=rndn(0,4)})});
// Lacuna central: T8A e T8B fracas em C10 (TMC na APS); T10A fraca em C11; SC (C12/C13) moderadamente fraca em toda a escola
BIAS.T8A.C10=-19;BIAS.T8B.C10=-16;BIAS.T10A.C11=-14;BIAS.T12A.C11=-6;
TURMAS.forEach(t=>{BIAS[t.id].C12-=8;BIAS[t.id].C13-=6;BIAS[t.id].C07+=5;BIAS[t.id].C05+=3});
BIAS.T4A.C12=-15;BIAS.T6A.C09=-9;BIAS.T12A.C02=-7;
// Efeito da intervenção (T8A, C10): a partir de A4
const EFFECT={T8A:{C10:{A4:11,A5:19}},T10A:{C11:{A5:9}}};

const FIRST=['Ana Beatriz','Bruno','Camila','Diego','Eduarda','Felipe','Gabriela','Henrique','Isabela','João Pedro','Karina','Lucas','Mariana','Nicolas','Olívia','Pedro','Rafaela','Samuel','Tainá','Vinícius','Yasmin','Arthur','Beatriz','Caio','Daniela','Enzo','Fernanda','Gustavo','Heloísa','Igor','Júlia','Kauã','Larissa','Matheus','Natália','Otávio','Paloma','Rodrigo','Sofia','Thiago'];
const LAST=['Lourenço','Carvalho','Nogueira','Siqueira','Prado','Menezes','Azevedo','Brandão','Camargo','Dantas','Esteves','Farias','Guimarães','Holanda','Ibiapina','Jardim','Lacerda','Macedo','Navarro','Oliveira','Pacheco','Quintela','Rangel','Sales','Teixeira','Uchoa','Vilaça','Xavier','Zanetti','Amorim'];

// Alunos
const ALUNOS=[];let aid=1;
TURMAS.forEach(t=>{for(let i=0;i<t.n;i++){
  const ab=clamp(rndn(63,11),28,95);
  const comps={};COMPS.forEach(c=>comps[c.id]=rndn(0,7));
  ALUNOS.push({id:'AL'+String(aid++).padStart(4,'0'),nome:(i===0&&t.id==='T8A')?'Ana Beatriz Lourenço':pick(FIRST)+' '+pick(LAST)+' '+pick(LAST),turma:t.id,ab,comps,
    engaj:clamp(rndn(68,18),10,100),part:rng()>0.07});
}});
INST.alunos=ALUNOS.length;
// Matriz de resultados: aluno × avaliação × competência → % de acerto (apenas para comps do período)
const RES={};
ALUNOS.forEach(al=>{RES[al.id]={};const t=TURMA[al.turma];const cps=compsForPer(t.per);
 AVALS.forEach((av,ai)=>{if(!al.part&&av.id==='A5')return; if(rng()<0.04)return; // ausência ocasional
  RES[al.id][av.id]={};cps.forEach(c=>{
   const eff=(EFFECT[t.id]&&EFFECT[t.id][c.id]&&EFFECT[t.id][c.id][av.id])||0;
   const itens=Math.max(3,Math.round(av.itens/cps.length));
   const s=clamp(al.ab+BIAS[t.id][c.id]+al.comps[c.id]+ai*1.6+eff+rndn(0,6),8,99);
   RES[al.id][av.id][c.id]={s:Math.round(s),n:itens};
  })});});

// Agregações
function agg(alunos,avId,compId){let tot=0,n=0;alunos.forEach(a=>{const r=RES[a.id][avId];if(r&&r[compId]){tot+=r[compId].s;n++}});return n?{m:tot/n,n}:null}
function turmaAlunos(tid){return ALUNOS.filter(a=>a.turma===tid)}
function turmaCompAvg(tid,cid,avId){return agg(turmaAlunos(tid),avId,cid)}
function alunoAvg(al,avId){const r=RES[al.id][avId];if(!r)return null;const v=Object.values(r);return v.reduce((s,x)=>s+x.s,0)/v.length}

function svgLine(series,opts){ // series: [{name,color,pts:[{x,y,lbl}]}]
 const W=opts.w||560,H=opts.h||200,pl=36,pr=12,pt=14,pb=28;const ys=series.flatMap(s=>s.pts.map(p=>p.y)).filter(y=>y!=null);
 const minY=opts.min!=null?opts.min:Math.max(0,Math.floor((Math.min(...ys)-8)/10)*10),maxY=opts.max!=null?opts.max:Math.min(100,Math.ceil((Math.max(...ys)+6)/10)*10);
 const n=Math.max(...series.map(s=>s.pts.length));const xs=i=>pl+i*(W-pl-pr)/Math.max(1,n-1);const ys_=y=>pt+(H-pt-pb)*(1-(y-minY)/(maxY-minY||1));
 let g='';for(let v=minY;v<=maxY;v+=10){g+=`<line x1="${pl}" x2="${W-pr}" y1="${ys_(v)}" y2="${ys_(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${ys_(v)+4}" fill="var(--chumbo)" font-size="10" text-anchor="end" font-family="IBM Plex Mono">${v}</text>`}
 if(opts.ref!=null)g+=`<line x1="${pl}" x2="${W-pr}" y1="${ys_(opts.ref)}" y2="${ys_(opts.ref)}" stroke="#F5A623" stroke-dasharray="4 4"/><text x="${W-pr}" y="${ys_(opts.ref)-4}" fill="#F5A623" font-size="10" text-anchor="end" font-family="IBM Plex Mono">${opts.refLbl||'referência'}</text>`;
 if(opts.band){g+=`<rect x="${xs(opts.band[0])}" y="${pt}" width="${xs(opts.band[1])-xs(opts.band[0])}" height="${H-pt-pb}" fill="rgba(0,194,168,.08)"/><text x="${(xs(opts.band[0])+xs(opts.band[1]))/2}" y="${pt+10}" fill="#00C2A8" font-size="10" text-anchor="middle" font-family="IBM Plex Mono">${opts.bandLbl||'intervenção'}</text>`}
 const labels=series[0].pts.map((p,i)=>`<text x="${xs(i)}" y="${H-8}" fill="var(--chumbo)" font-size="10" text-anchor="middle" font-family="IBM Plex Mono">${p.lbl||''}</text>`).join('');
 const lines=series.map(s=>{const d=s.pts.map((p,i)=>p.y==null?null:`${xs(i)},${ys_(p.y)}`).filter(Boolean);const path=d.length?'M'+d.join(' L'):'';return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" ${s.dash?'stroke-dasharray="5 4"':''}/>`+s.pts.map((p,i)=>p.y==null?'':`<circle cx="${xs(i)}" cy="${ys_(p.y)}" r="3.5" fill="${s.color}"><title>${s.name}: ${Math.round(p.y)}${p.tip?' · '+p.tip:''}</title></circle>`).join('')}).join('');
 return `<svg class="svgchart" viewBox="0 0 ${W} ${H}">${g}${labels}${lines}</svg>`}
function svgBars(items,opts){ // [{lbl,v,color}]
 const W=opts.w||560,H=opts.h||180,pl=30,pr=8,pt=10,pb=36;const max=opts.max||100;const bw=(W-pl-pr)/items.length;
 const bars=items.map((it,i)=>{const h=(H-pt-pb)*(it.v/max);const x=pl+i*bw+bw*.18;return `<rect x="${x}" y="${H-pb-h}" width="${bw*.64}" height="${h}" rx="3" fill="${it.color||'#00C2A8'}"><title>${it.lbl}: ${Math.round(it.v)}</title></rect><text x="${x+bw*.32}" y="${H-pb-h-4}" fill="var(--neblina)" font-size="10" text-anchor="middle" font-family="IBM Plex Mono">${opts.fmt?opts.fmt(it.v):Math.round(it.v)}</text><text x="${x+bw*.32}" y="${H-pb+14}" fill="var(--chumbo)" font-size="9.5" text-anchor="middle">${it.lbl.length>14?it.lbl.slice(0,13)+'…':it.lbl}</text>`}).join('');
 const ref=opts.ref!=null?`<line x1="${pl}" x2="${W-pr}" y1="${H-pb-(H-pt-pb)*(opts.ref/max)}" y2="${H-pb-(H-pt-pb)*(opts.ref/max)}" stroke="#F5A623" stroke-dasharray="4 4"/>`:'';
 return `<svg class="svgchart" viewBox="0 0 ${W} ${H}">${ref}${bars}</svg>`}
function spark(vals,color,w,h){w=w||80;h=h||22;const min=Math.min(...vals),max=Math.max(...vals);const pts=vals.map((v,i)=>`${i*(w/(vals.length-1))},${h-2-(h-4)*((v-min)/((max-min)||1))}`);return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="M${pts.join(' L')}" fill="none" stroke="${color||'#00C2A8'}" stroke-width="1.6"/></svg>`}
function ring(v,color,size){size=size||86;const r=(size-10)/2,c=2*Math.PI*r;return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--grid)" stroke-width="7" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color||'#00C2A8'}" stroke-width="7" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}" stroke-linecap="round"/></svg><div class="rv" style="font-size:${size/4}px">${Math.round(v)}</div></div>`}
function donut(parts,size){size=size||120;const tot=parts.reduce((s,p)=>s+p.v,0);let acc=0;const r=(size-14)/2,c=2*Math.PI*r;const segs=parts.map(p=>{const f=p.v/tot;const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${p.color}" stroke-width="12" fill="none" stroke-dasharray="${c*f} ${c*(1-f)}" stroke-dashoffset="${-c*acc}" transform="rotate(-90 ${size/2} ${size/2})"><title>${p.lbl}: ${fmt(p.v)}</title></circle>`;acc+=f;return s}).join('');return `<svg width="${size}" height="${size}">${segs}</svg>`}
const badgeStatus=s=>`<span class="badge b-${s==='ok'?'ok':s==='warn'?'warn':'crit'}">${statusLbl[s]}</span>`;
function barRow(lbl,v,extra){const st=statusOf(v);return `<div class="rowbar"><span title="${lbl}">${lbl.length>26?lbl.slice(0,25)+'…':lbl}</span><div class="bar"><i class="${st}" style="width:${v}%"></i></div><span class="n">${Math.round(v)}${extra||''}</span></div>`}

PAGES.exec=function(){const av=state.filters.aval;const prev=AVALS[Math.max(0,AVALS.findIndex(a=>a.id===av)-1)].id;
 const inst=instAvg(av),instPrev=instAvg(prev);const part=participacao(null,av);
 // competências críticas (média institucional <55)
 const compAvg=COMPS.map(c=>{const r=agg(ALUNOS,av,c.id);return {c,m:r?r.m:null}}).filter(x=>x.m!=null).sort((a,b)=>a.m-b.m);
 const crit=compAvg.filter(x=>x.m<55).length,warn=compAvg.filter(x=>x.m>=55&&x.m<70).length;
 const ativas=INTERV.filter(i=>i.status==='em_andamento').length;
 const atencao=TURMAS.reduce((s,t)=>s+alunosAtencao(t.id).length,0);
 // régua: % alunos com média ≥60 no simulado A3 (apenas ilustrativo)

 </div>

  <div class="card"><div class="ch"><h3>Alertas</h3><span class="hint">gerados por regras explícitas</span></div>${alerts.map(a=>`<div class="alert-item" onclick="${a.go}"><span class="badge b-${a.k}" style="margin-top:2px">${a.k==='crit'?'!':a.k==='warn'?'•':'✓'}</span><div><div class="ttl">${a.t}</div><div class="ds">${a.d}</div></div></div>`).join('')}</div>

function relatorioExec(){const av=state.filters.aval;const compAvg=COMPS.map(c=>({c,r:agg(ALUNOS,av,c.id)})).filter(x=>x.r).sort((a,b)=>a.r.m-b.r.m);
 openModal('Relatório executivo — '+AVAL[av].nome,`<div class="callout info mb"><span>ⓘ</span><div>Relatório gerado a partir dos dados da plataforma (fictícios). Cada número é reproduzível a partir da exportação aluno × item (hash de auditoria incluído no rodapé).</div></div>
 <h4>1. Síntese</h4><p class="small">Índice institucional de <b>${Math.round(instAvg(av))}</b> (escala interna 0–100), participação de <b>${pct(participacao(null,av).pct)}</b>. ${compAvg.filter(x=>x.r.m<55).length} competências em nível crítico, concentradas em <b>${[...new Set(compAvg.filter(x=>x.r.m<55).map(x=>AREA[x.c.area].nome))].join(', ')||'—'}</b>.</p>
 <h4 class="mt">2. Competências por prioridade</h4><table class="tb"><tr><th>Competência</th><th>Área · contexto</th><th class="num">Média</th><th class="num">Turmas &lt; 55</th><th>Intervenção</th></tr>${compAvg.slice(0,8).map(x=>`<tr><td>${x.c.nome}</td><td class="small muted">${AREA[x.c.area].nome} · ${x.c.ctx}</td><td class="num">${Math.round(x.r.m)}</td><td class="num">${TURMAS.filter(t=>{const r=turmaCompAvg(t.id,x.c.id,av);return r&&r.m<55}).length}</td><td>${INTERV.find(i=>i.comp===x.c.id)?'<span class="badge b-teal">registrada</span>':'<span class="badge b-mute">nenhuma</span>'}</td></tr>`).join('')}</table>
 <h4 class="mt">3. Intervenções e resultados</h4>${INTERV.filter(i=>i.status==='concluida').map(i=>{const pre=turmaCompAvg(i.turma,i.comp,i.pre),pos=turmaCompAvg(i.turma,i.comp,i.pos);return `<p class="small"><b>${i.titulo}</b> (${TURMA[i.turma].nome}): ${Math.round(pre.m)} → ${Math.round(pos.m)} entre ${AVAL[i.pre].mes} e ${AVAL[i.pos].mes}; adesão ${i.adesao}%. <i class="muted">${i.obs}</i></p>`}).join('')||'<p class="small muted">Nenhuma intervenção concluída no período.</p>'}
 <h4 class="mt">4. Limites de interpretação</h4><p class="small muted">Índices internos não equivalem à nota ENAMED. Avaliações diferentes usam itens diferentes; variações pequenas (&lt; 5 pts) podem refletir diferença de prova, não de aprendizagem. Melhora após intervenção não demonstra causalidade.</p>

/* ── 1b. RÉGUA ENAMED — 3 ETAPAS ───────────────────────── */
PAGES.regua=function(){const etapas=[{e:'1ª etapa',q:'final do 4º semestre',foco:'Ciclo básico / teoria',turma:'T4A'},{e:'2ª etapa',q:'final do 8º semestre (antes do internato)',foco:'Ciclo clínico · somativa pré-internato (DCN 2025, art. 36)',turma:'T8A'},{e:'3ª etapa',q:'12º semestre',foco:'Conhecimento aplicado · proficiência',turma:'T12A'}];
 return `<div class="ph"><div class="t"><div class="eyebrow">Preparação longitudinal</div><h1>Régua ENAMED em três etapas</h1><small>Visão do curso organizada pelas etapas previstas no PLV 14/2026 (aprovado pelo Congresso em 15/10/2026, <b>pendente de sanção</b> em 19/10/2026) e pela avaliação somativa pré-internato exigida pelas novas DCN (Res. CNE/CES 3/2025). Os pesos e a nota mínima ainda dependem de regulamentação.</small></div></div>
 <div class="callout warn mb"><span>⚠</span><div><b>Estado regulatório (verificado em 19/10/2026).</b> MP 1.370/2026 em vigor desde 19/06/2026; projeto de conversão aprovado, sem sanção publicada. A régua abaixo é uma leitura de produto, não uma obrigação já regulamentada em todos os detalhes.</div></div>
 <div class="grid g3 mb">${etapas.map((et,i)=>{const t=TURMA[et.turma];const m=turmaAvg(t.id,'A5');const cps=compsForPer(t.per);const crit=cps.filter(c=>{const r=turmaCompAvg(t.id,c.id,'A5');return r&&r.m<55});return `<div class="card"><div class="eyebrow">${et.e}</div><h3>${et.q}</h3><p class="small muted">${et.foco}</p><div class="row mt" style="gap:16px">${ring(m,i===1?'#FF6B6B':'#00C2A8',78)}<div><div class="small muted">Turma de referência</div><b>${t.nome}</b><div class="small muted mt8">${cps.length} competências avaliáveis · ${crit.length} críticas</div></div></div><div class="mt">${crit.slice(0,3).map(c=>`<span class="tag" style="color:#FF6B6B">${c.nome}</span>`).join('')||'<span class="tag">sem competência crítica</span>'}</div><button class="btn sm mt" onclick="go('acad',{turma:'${t.id}'})">Abrir turma</button></div>`}).join('')}</div>
 <div class="card"><div class="ch"><h3>Como a plataforma apoia cada etapa</h3></div><table class="tb"><tr><th>Etapa</th><th>Diagnóstico</th><th>Preparação</th><th>Verificação</th><th>Evidência para a instituição</th></tr>
 <tr><td>1ª (4º sem.)</td><td>Diagnóstico de entrada + teste de progresso interno</td><td>Trilhas por competência básica (SC, MFC, fisiologia aplicada)</td><td>Prova ordinária com matriz alinhada</td><td>Cobertura e lacunas precoces por turma</td></tr>
 <tr><td>2ª (8º sem.)</td><td>Simulado institucional 100 itens (formato Inep)</td><td>Intervenções por competência + listas dirigidas</td><td>Somativa pré-internato (DCN art. 36, parágrafo único)</td><td>Plano de ação individualizado (DCN art. 37 §1º) documentado</td></tr>
 <tr><td>3ª (12º sem.)</td><td>Simulados periódicos + análise por área/contexto</td><td>Plano de estudo até a prova, reteste</td><td>Simulado final e prontidão por competência</td><td>Histórico longitudinal por concluinte, exportável</td></tr></table>
 <p class="note mt">O que a plataforma não faz: não prevê nota ENAMED individual nem garante proficiência. Ela organiza evidências e ações. Qualquer estimativa de prontidão exigiria calibração com resultados reais (roadmap P2).</p></div>`};

 return `<div class="ph"><div class="t"><div class="eyebrow">Coordenação do curso</div><h1>Turmas & competências</h1><small>Dados <b>agregados por turma</b>. A visão individual só aparece ao abrir um estudante, com registro de acesso.</small></div><div class="actions">${avalSel("setFilter('aval',this.value)")}</div></div>

 ${TURMAS.map(t=>{const m=turmaAvg(t.id,av);const part=participacao(t.id,av);const cps=compsForPer(t.per);const crit=cps.filter(c=>{const r=turmaCompAvg(t.id,c.id,av);return r&&r.m<55}).length;const vals=AVALS.map(a=>turmaAvg(t.id,a.id)).filter(x=>x!=null);return `<tr class="click" onclick="go('acad',{turma:'${t.id}'})"><td><b>${t.nome}</b><span class="sub">${t.id} · ${cps.length} competências avaliáveis</span></td><td class="small">${t.campus}</td><td class="num">${t.n}</td><td class="num">${pct(part.pct)}</td><td class="num"><b style="color:${m>=70?'#22C55E':m>=55?'#F5A623':'#FF6B6B'}">${m!=null?Math.round(m):'—'}</b></td><td>${spark(vals)}</td><td class="num">${crit?`<span class="badge b-crit">${crit}</span>`:'<span class="badge b-ok">0</span>'}</td><td class="num">${alunosAtencao(t.id).length}</td><td><button class="btn xs">Abrir →</button></td></tr>`}).join('')}</table></div>

 const m=turmaAvg(tid,av);const part=participacao(tid,av);const att=alunosAtencao(tid);
 let body='';
 if(tab==='comp'){body=`<div class="grid g-3-2"><div class="card"><div class="ch"><h3>Competências na ${AVAL[av].nome}</h3><span class="hint">ordenadas por prioridade</span></div><table class="tb"><tr><th>Competência</th><th>Área</th><th class="num">Média</th><th class="num">Itens/aluno</th><th>Status</th><th>Tendência</th><th></th></tr>${compRows.map(x=>`<tr class="click ${sel===x.c.id?'':''}" style="${sel===x.c.id?'outline:1px solid var(--pulso)':''}" onclick="go('acad',{turma:'${tid}',comp:'${x.c.id}'})"><td><b>${x.c.nome}</b><span class="sub">${x.c.ctx}</span></td><td><span class="badge b-mute" style="color:${AREA[x.c.area].cor}">${x.c.area}</span></td><td class="num"><b>${Math.round(x.r.m)}</b></td><td class="num">${Math.max(3,Math.round(AVAL[av].itens/cps.length))}</td><td>${badgeStatus(statusOf(x.r.m))}</td><td>${spark(x.hist.filter(v=>v!=null),x.r.m<55?'#FF6B6B':'#00C2A8')}</td><td><button class="btn xs">detalhar</button></td></tr>`).join('')}</table></div>
 <div>${sel?compDetail(tid,sel):`<div class="card"><div class="empty"><b>Selecione uma competência</b>para ver objetivos educacionais, distribuição e grupos que precisam de apoio.</div></div>`}</div></div>`}
 else if(tab==='alunos'){const rows=al.map(a=>({a,m:alunoAvg(a,av),hist:AVALS.map(v=>alunoAvg(a,v.id))})).sort((x,y)=>(x.m??999)-(y.m??999));

 else if(tab==='avals'){body=`<div class="card"><table class="tb"><tr><th>Avaliação</th><th>Tipo</th><th>Data</th><th class="num">Itens</th><th class="num">Participação</th><th class="num">Média</th><th>Competências</th><th></th></tr>${AVALS.map(a=>{const pt=participacao(tid,a.id);const mm=turmaAvg(tid,a.id);return `<tr><td><b>${a.nome}</b></td><td><span class="badge b-info">${a.tipo}</span></td><td class="mono small">${a.data}</td><td class="num">${a.itens}</td><td class="num">${pt.p}/${pt.n}</td><td class="num">${mm!=null?Math.round(mm):'—'}</td><td class="small muted">${cps.length} competências</td><td><button class="btn xs" onclick="setFilter('aval','${a.id}')">usar como referência</button></td></tr>`}).join('')}</table><p class="note mt">Cada avaliação tem caderno fixo versionado; a matriz aluno × item × alternativa é exportável (roadmap P0.5).</p></div>`}

 // trilha longitudinal da competência: turmas de períodos diferentes como proxy de coorte (transversal) + evolução intra-turma
 const trail=TURMAS.filter(t=>compsForPer(t.per).some(x=>x.id===cid)).map(t=>({t,hist:AVALS.map(a=>{const r=turmaCompAvg(t.id,cid,a.id);return r?r.m:null})}));
 const intervs=INTERV.filter(i=>i.comp===cid);
 return `<div class="ph"><div class="t"><div class="eyebrow">Acompanhamento longitudinal · DCN 2025 art. 36</div><h1>Avaliação programática</h1><small>Conecta as avaliações do curso a competências e objetivos educacionais para enxergar dificuldades que uma prova isolada esconde. Cada avaliação é um ponto de baixo impacto; decisões de alto impacto usam o conjunto.</small></div><div class="actions"><select class="sel" onchange="go('prog',{comp:this.value})">${COMPS.map(x=>`<option value="${x.id}" ${x.id===cid?'selected':''}>${x.id} · ${x.nome}</option>`).join('')}</select><button class="btn" onclick="planoAcomp('${cid}')">Plano de acompanhamento</button></div></div>
 <div class="card mb"><div class="ch"><h3>Mapa currículo × competência (média na Avaliação de progresso · out)</h3><span class="hint">• = previsto no PPC sem avaliação ainda</span></div>${map}<p class="note mt8">Leitura transversal: cada coluna é uma turma diferente em outubro/2026. Leitura longitudinal real (mesma coorte ao longo dos anos) acumula a partir do 2º ano de uso.</p></div>
 <div class="grid g-2-1"><div class="card"><div class="ch"><div><div class="eyebrow">${c.id} · ${AREA[c.area].nome} · ${c.ctx}</div><h3>${c.nome}</h3></div></div>
 ${svgLine(trail.map((x,i)=>({name:x.t.nome,color:['#F5A623','#64B5E8','#FF6B6B','#D96AA7','#6B5CE7','#00C2A8'][i%6],pts:x.hist.map((y,j)=>({y,lbl:AVALS[j].mes}))})),{h:220,ref:55,refLbl:'limiar crítico'})}
 <div class="legend mt8">${trail.map((x,i)=>`<span><i style="background:${['#F5A623','#64B5E8','#FF6B6B','#D96AA7','#6B5CE7','#00C2A8'][i%6]}"></i>${x.t.nome}</span>`).join('')}</div>
 <h4 class="mt mb8">Leitura programática</h4>${cid==='C10'?`<p class="small">A dificuldade em <b>transtornos mentais comuns na APS</b> aparece nas duas turmas do 8º período desde o diagnóstico de fevereiro (44 e 47) e persiste no simulado de junho. A competência é introduzida no 4º período (onde o 4º A hoje está em ${Math.round(turmaCompAvg('T4A','C10','A5').m)}) e retomada no 6º e 8º — o padrão sugere lacuna de formação, não de uma prova específica. Após a oficina I-01 (jul–ago), o 8º A subiu para ${Math.round(turmaCompAvg('T8A','C10','A4').m)} em agosto e ${Math.round(turmaCompAvg('T8A','C10','A5').m)} em outubro; o 8º B, sem intervenção, permaneceu em ${Math.round(turmaCompAvg('T8B','C10','A5').m)}.</p><div class="callout info mt8"><span>ⓘ</span><div>A comparação 8º A × 8º B é observacional. Diferenças de docente, campus e composição de turma podem explicar parte do resultado. Serve para decidir o próximo passo, não para provar causalidade.</div></div>`:`<p class="small muted">Trilha gerada a partir dos dados simulados. Selecione C10 para ver o caso narrativo completo da demonstração.</p>`}
 </div>
 <div><div class="card mb"><div class="ch"><h3>Objetivos educacionais ligados</h3></div>${objFor(cid).map(o=>`<div class="small" style="padding:6px 0;border-bottom:1px solid var(--border-subtle)">• ${o}</div>`).join('')}<p class="note mt8">Itens do banco mapeados a esta competência: <b>${QUESTOES.filter(q=>q.comp===cid).length}</b> na amostra (${QUESTOES.filter(q=>q.comp===cid&&q.status==='publicada').length} publicados).</p></div>

 return `<div class="ph"><div class="t"><div class="eyebrow">Da informação à ação</div><h1>Intervenções pedagógicas</h1><small>Cada intervenção liga uma lacuna (turma × competência) a um responsável, atividades, adesão e um reteste. O resultado volta para a visão executiva.</small></div><div class="actions"><button class="btn primary" onclick="newInterv()">+ Nova intervenção</button></div></div>
 <div class="filters"><div class="chips">${[['','Todas'],['planejada','Planejadas'],['em_andamento','Em andamento'],['concluida','Concluídas']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" onclick="go('interv',{f:'${k}'})">${l} (${INTERV.filter(i=>!k||i.status===k).length})</button>`).join('')}</div></div>

function newInterv(tid,cid){const tsel=tid||'T8B',csel=cid||'C10';
 openModal('Nova intervenção pedagógica',`<div class="steps"><div class="st on"><span class="n">1</span>Lacuna</div><div class="sep"></div><div class="st"><span class="n">2</span>Ação</div><div class="sep"></div><div class="st"><span class="n">3</span>Verificação</div></div>
 <div class="grid g2"><div class="fld"><label>Turma</label><select id="ni-turma">${TURMAS.map(t=>`<option value="${t.id}" ${t.id===tsel?'selected':''}>${t.nome}</option>`).join('')}</select></div><div class="fld"><label>Competência (lacuna)</label><select id="ni-comp">${COMPS.map(c=>`<option value="${c.id}" ${c.id===csel?'selected':''}>${c.id} · ${c.nome}</option>`).join('')}</select></div></div>
 <div class="callout crit mb" id="ni-ctx"><span>!</span><div>${(()=>{const r=turmaCompAvg(tsel,csel,state.filters.aval);return r?`Média atual da turma nesta competência: <b>${Math.round(r.m)}</b> (${AVAL[state.filters.aval].nome}). ${alunosAtencao(tsel).length} estudantes sinalizados.`:'Sem dados para esta combinação.'})()}</div></div>
 <div class="fld"><label>Título</label><input id="ni-titulo" value="Tutoria dirigida: ${COMP[csel].nome}"></div>
 <div class="grid g2"><div class="fld"><label>Tipo de ação</label><select id="ni-tipo"><option>Lista dirigida de questões (plataforma)</option><option>Oficina de casos clínicos</option><option>Tutoria individual</option><option>Aula de reforço</option><option>Preceptoria em cenário de prática</option></select></div><div class="fld"><label>Responsável</label><select id="ni-resp">${DOCENTES.map(d=>`<option value="${d.id}" ${d.area===COMP[csel].area?'selected':''}>${d.nome} — ${d.papel}</option>`).join('')}</select></div></div>
 <div class="grid g2"><div class="fld"><label>Início</label><input type="date" id="ni-ini" value="2026-10-26"></div><div class="fld"><label>Término previsto</label><input type="date" id="ni-fim" value="2026-11-27"></div></div>
 <div class="fld"><label>Conteúdo vinculado (seleção assistida do banco)</label><div class="pill-row">${QUESTOES.filter(q=>q.comp===csel&&q.status==='publicada').slice(0,5).map(q=>`<span class="tag" style="color:#00C2A8">${q.id} · ${q.tema}</span>`).join('')}<span class="tag">+ ${Math.max(0,QUESTOES.filter(q=>q.comp===csel&&q.status==='publicada').length-5)} itens</span></div></div>
 <div class="fld"><label>Verificação (reteste)</label><select id="ni-pos"><option>Embutir 8 itens da competência na próxima prova ordinária</option><option>Avaliação de progresso de dezembro</option><option>Lista de reteste específica (20 itens)</option></select></div>
 <div class="fld"><label>Estudantes</label><label class="chk"><input type="radio" name="ni-alvo" checked> Toda a turma (atividade coletiva)</label><label class="chk"><input type="radio" name="ni-alvo"> Apenas estudantes sinalizados (plano individual · DCN art. 37 §1º)</label></div>`,
 `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveInterv()">Criar intervenção</button>`)}
function saveInterv(){const g=id=>document.getElementById(id).value;const id='I-'+String(INTERV.length+1).padStart(2,'0');const i={id,titulo:g('ni-titulo'),turma:g('ni-turma'),comp:g('ni-comp'),resp:g('ni-resp'),tipo:g('ni-tipo'),inicio:g('ni-ini'),fim:g('ni-fim'),status:'planejada',adesao:null,pre:state.filters.aval,pos:null,obs:'Criada na demonstração. Reteste: '+g('ni-pos'),atividades:[g('ni-tipo'),'Lista dirigida vinculada à competência','Reteste: '+g('ni-pos')],novo:true};
 INTERV.unshift(i);state.created.interv++;persist();audit(`Criou intervenção ${id} (${i.turma} · ${i.comp})`);closeModal();toast(`<b>${id}</b> criada. O responsável recebe a tarefa; os estudantes veem a lista dirigida em "Minha jornada".`,'ok');go('interv')}

/* ── 4b. ACOMPANHAMENTO INDIVIDUAL (tutor) ─────────────── */
PAGES.tutor=function(){const rows=TURMAS.flatMap(t=>alunosAtencao(t.id).map(x=>({...x,t})));
 return `<div class="ph"><div class="t"><div class="eyebrow">Tutoria acadêmica</div><h1>Acompanhamento individual</h1><small>Lista de estudantes sinalizados por regra explícita (média &lt; 55 na última avaliação ou queda &gt; 10 pts). Sinal acadêmico, não diagnóstico.</small></div><div class="actions"><button class="btn" onclick="toast('Regra de sinalização aberta para edição (simulado).')">⚙ Regra de sinalização</button></div></div>
 <div class="grid g4 mb"><div class="card kpi warn"><div class="lbl">Sinalizados</div><div class="val">${rows.length}</div></div><div class="card kpi"><div class="lbl">Com plano individual</div><div class="val">${Math.round(rows.length*.6)}</div><div class="delta">${Math.round(60)}% · meta 100%</div></div><div class="card kpi"><div class="lbl">Orientações registradas (30 d)</div><div class="val">38</div></div><div class="card kpi accent"><div class="lbl">Saíram do sinal após plano</div><div class="val">11</div><div class="delta">desde ago/26</div></div></div>
 <div class="card"><table class="tb"><tr><th>Estudante</th><th>Turma</th><th class="num">Última média</th><th class="num">Anterior</th><th>Motivo</th><th>Plano</th><th></th></tr>${rows.map(x=>`<tr class="click" onclick="openAluno('${x.a.id}')"><td><b>${x.a.nome}</b><span class="sub">${x.a.id}</span></td><td class="small">${x.t.nome}</td><td class="num">${Math.round(x.last)}</td><td class="num muted">${x.prev!=null?Math.round(x.prev):'—'}</td><td>${x.queda?'<span class="badge b-warn">queda &gt; 10 pts</span>':'<span class="badge b-crit">média &lt; 55</span>'}</td><td>${hsh(x.a.id)>.4?'<span class="badge b-teal">ativo</span>':'<span class="badge b-mute">pendente</span>'}</td><td><button class="btn xs">abrir 🔒</button></td></tr>`).join('')}</table></div>`};

/* ── 5. PROVAS & AVALIAÇÕES ────────────────────────────── */
PAGES.prova=function(){const p=state.params;if(p.id)return provaView(p.id);
 return `<div class="ph"><div class="t"><div class="eyebrow">Gestão de avaliações</div><h1>Provas & avaliações</h1><small>Da matriz de avaliação à correção: provas ordinárias, simulados institucionais e avaliações de progresso com caderno fixo versionado, revisão e resultados por competência.</small></div><div class="actions"><button class="btn" onclick="toast('Importação de prova própria (PDF/DOCX) abre o Motor A com a instituição como titular.','ok')">⬆ Importar prova própria</button><button class="btn primary" onclick="novaProva()">+ Nova avaliação</button></div></div>
 <div class="grid g4 mb"><div class="card kpi"><div class="lbl">Avaliações em 2026</div><div class="val">${PROVAS.length+3}</div></div><div class="card kpi warn"><div class="lbl">Aguardando revisão</div><div class="val">${PROVAS.filter(x=>x.status==='em_revisao').length}</div></div><div class="card kpi accent"><div class="lbl">Itens aplicados no ano</div><div class="val">${fmt(PROVAS.filter(x=>x.status==='aplicada').reduce((s,x)=>s+x.itens*x.turma.split(',').length,0)+940)}</div></div><div class="card kpi"><div class="lbl">Tempo médio de montagem</div><div class="val">1,8<small> h</small></div><div class="delta">vs. ~3 semanas no processo manual relatado</div></div></div>
 <div class="card"><table class="tb"><tr><th>Avaliação</th><th>Turmas</th><th class="num">Itens</th><th class="num">Versões</th><th>Data</th><th>Autor</th><th>Status</th><th></th></tr>${PROVAS.map(x=>`<tr class="click" onclick="go('prova',{id:'${x.id}'})"><td><b>${x.titulo}</b><span class="sub">${x.id} · ${x.comps.length} competências</span></td><td class="small">${x.turma.split(',').map(t=>TURMA[t]?TURMA[t].nome.split(' ·')[0]:t).join(', ')}</td><td class="num">${x.itens}</td><td class="num">${x.versoes}</td><td class="mono small">${x.data}</td><td class="small">${x.autor}</td><td><span class="badge ${PROVA_STATUS[x.status][1]}">${PROVA_STATUS[x.status][0]}</span></td><td><button class="btn xs">abrir</button></td></tr>`).join('')}</table></div>
 <div class="grid g2 mt"><div class="card"><div class="ch"><h3>Formatos suportados nesta versão</h3></div><table class="tb"><tr><th>Formato</th><th>Status no produto</th><th>Justificativa</th></tr><tr><td>Objetiva (4 alternativas, padrão Inep)</td><td><span class="badge b-ok">v1</span></td><td class="small muted">Base do ENAMED e das provas ordinárias; correção automática e psicometria.</td></tr><tr><td>Discursiva com rubrica</td><td><span class="badge b-warn">fase 2</span></td><td class="small muted">Útil para somativa pré-internato; exige correção humana e calibração.</td></tr><tr><td>OSCE / estações práticas (checklist)</td><td><span class="badge b-info">fase 3 · validar</span></td><td class="small muted">Alta relevância na DCN (domínio psicomotor), alta complexidade operacional.</td></tr><tr><td>Mini-CEX / portfólio</td><td><span class="badge b-mute">fora do escopo inicial</span></td><td class="small muted">Registro longitudinal possível via integração, não via produção própria.</td></tr></table></div>
 <div class="card"><div class="ch"><h3>O problema que resolve</h3></div><p class="small">Na reunião de 12/10, um médico relatou uma escola cujas provas semestrais têm 18 questões porque os docentes não conseguem produzir mais. A plataforma troca a produção artesanal por <b>matriz + banco curado + seleção assistida + revisão docente</b>, mantendo a autoria pedagógica na instituição.</p><div class="stat-list mt"><div class="si"><span>Itens por prova (relato)</span><b>18 → 80–100</b></div><div class="si"><span>Produção docente necessária</span><b>revisão, não criação do zero</b></div><div class="si"><span>Cobertura da matriz por prova</span><b>garantida pela cota</b></div></div></div></div>`};
function provaView(id){const x=PROVAS.find(p=>p.id===id);if(!x)return '<div class="empty">Prova não encontrada</div>';const turmas=x.turma.split(',');const qs=QUESTOES.filter(q=>x.comps.includes(q.comp)&&q.status==='publicada').slice(0,Math.min(14,x.itens));
 const areaDist=AREAS.map(a=>({lbl:a.id,v:Math.round(x.itens*(({CM:.25,CG:.15,GO:.14,PED:.14,MFC:.1,SM:.08,SC:.14})[a.id])),color:a.cor}));
 let results='';if(x.status==='aplicada'&&x.aval){const av=x.aval;results=`<div class="grid g2 mt"><div class="card"><div class="ch"><h3>Resultado por competência</h3><span class="hint">${AVAL[av].nome}</span></div>${x.comps.map(c=>{let t=0,n=0;turmas.forEach(tid=>{const r=turmaCompAvg(tid,c,av);if(r){t+=r.m*r.n;n+=r.n}});return n?barRow(COMP[c].nome,t/n):''}).join('')}</div>
 <div class="card"><div class="ch"><h3>Análise de itens (TCT)</h3><span class="hint">n = ${turmas.reduce((s,t)=>s+participacao(t,av).p,0)} respondentes</span></div><table class="tb"><tr><th>Item</th><th class="num">p (facilidade)</th><th class="num">Discrim.</th><th>Sinal</th></tr>${qs.slice(0,8).map(q=>`<tr class="click" onclick="openQuestao('${q.id}')"><td class="mono small">${q.id}</td><td class="num">${q.p!=null?q.p.toFixed(2):'—'}</td><td class="num">${q.disc!=null?q.disc.toFixed(2):'—'}</td><td>${q.flags.length?q.flags.map(f=>`<span class="badge b-warn">${f}</span>`).join(' '):'<span class="badge b-ok">ok</span>'}</td></tr>`).join('')}</table><p class="note mt8">Índices de Teoria Clássica dos Testes; discriminação = correlação ponto-bisserial. Com n &lt; 100 respondentes, sinais são indicativos e não levam à retirada automática do item.</p></div></div>`}
 return `<div class="ph"><div class="t"><div class="eyebrow"><a href="#" onclick="event.preventDefault();go('prova')">Provas</a> › ${x.id}</div><h1>${x.titulo}</h1><small>${turmas.map(t=>TURMA[t]?TURMA[t].nome:t).join(' · ')} · ${x.itens} itens · ${x.versoes} versão(ões) · ${x.data} · autor: ${x.autor}</small></div><div class="actions"><span class="badge ${PROVA_STATUS[x.status][1]}">${PROVA_STATUS[x.status][0]}</span>${x.status==='em_revisao'?`<button class="btn" onclick="provaRevisao('${x.id}')">Revisar itens</button><button class="btn primary" onclick="setProvaStatus('${x.id}','aprovada')">✓ Aprovar</button>`:''}${x.status==='aprovada'?`<button class="btn primary" onclick="setProvaStatus('${x.id}','publicada')">Publicar para as turmas</button>`:''}${x.status==='rascunho'?`<button class="btn primary" onclick="setProvaStatus('${x.id}','em_revisao')">Enviar para revisão</button>`:''}${x.status==='publicada'?`<button class="btn" onclick="toast('Caderno PDF + folha de respostas + gabarito separado gerados (simulado).','ok')">⬇ Caderno / gabarito</button>`:''}${x.status==='aplicada'?`<button class="btn" onclick="toast('Exportação aluno × item × alternativa gerada (CSV + dicionário + hash).','ok');audit('Exportou matriz de respostas ${x.id}')">⬇ Exportar aluno × item</button>`:''}</div></div>
 <div class="grid g-2-1"><div class="card"><div class="ch"><h3>Matriz de avaliação</h3><span class="hint">distribuição por área · cotas</span></div>${svgBars(areaDist,{h:150,max:Math.max(...areaDist.map(a=>a.v))+6,fmt:v=>v})}<div class="pill-row mt8">${x.comps.map(c=>`<span class="tag">${COMP[c].id} ${COMP[c].nome}</span>`).join('')}</div></div>
 <div class="card"><div class="ch"><h3>Fluxo</h3></div><div class="tl"><div class="ev ok"><div class="d">etapa 1</div><div class="t">Matriz definida</div></div><div class="ev ${['em_revisao','aprovada','publicada','aplicada'].includes(x.status)?'ok':'mute'}"><div class="d">etapa 2</div><div class="t">Itens selecionados (${x.itens})</div></div><div class="ev ${['aprovada','publicada','aplicada'].includes(x.status)?'ok':x.status==='em_revisao'?'warn':'mute'}"><div class="d">etapa 3</div><div class="t">Revisão docente / NDE</div></div><div class="ev ${['publicada','aplicada'].includes(x.status)?'ok':'mute'}"><div class="d">etapa 4</div><div class="t">Publicação (caderno fixo, ${x.versoes} versão)</div></div><div class="ev ${x.status==='aplicada'?'ok':'mute'}"><div class="d">etapa 5</div><div class="t">Aplicação, correção e análise</div></div></div></div></div>
 <div class="card mt"><div class="ch"><h3>Itens do caderno (amostra)</h3><span class="hint">${qs.length} de ${x.itens} exibidos · versão ${x.versoes}</span></div><table class="tb"><tr><th>#</th><th>Item</th><th>Área</th><th>Competência</th><th>Origem</th><th>Dific.</th><th></th></tr>${qs.map((q,i)=>`<tr class="click" onclick="openQuestao('${q.id}')"><td class="mono">${i+1}</td><td><b class="mono">${q.id}</b><span class="sub">${q.tema}</span></td><td><span class="badge b-mute" style="color:${AREA[q.area].cor}">${q.area}</span></td><td class="small">${COMP[q.comp].nome}</td><td class="small muted">${ORIGEM[q.origem].nome}</td><td><span class="badge b-mute">${q.dif}</span></td><td><button class="btn xs" onclick="event.stopPropagation();toast('Item substituído por equivalente (mesma competência/dificuldade) — simulado.','ok')">substituir</button></td></tr>`).join('')}</table></div>${results}`}
function setProvaStatus(id,st){const x=PROVAS.find(p=>p.id===id);x.status=st;persist();audit(`Prova ${id}: ${st}`);toast(`${id} → <b>${PROVA_STATUS[st][0]}</b>.${st==='publicada'?' Os estudantes das turmas veem a avaliação na agenda.':''}`,'ok');rerender()}
function provaRevisao(id){openModal('Revisão de itens · '+id,`<p class="small muted mb">Cada revisor marca itens com problema; comentários ficam no histórico da questão (não da prova).</p>${QUESTOES.filter(q=>q.status==='publicada').slice(0,5).map(q=>`<div class="card flat mb8"><div class="row sb"><b class="mono">${q.id}</b><span class="small muted">${q.tema} · ${COMP[q.comp].nome}</span></div><p class="small mt8">${q.enun}</p><div class="row mt8"><button class="btn xs" onclick="toast('Item ${q.id} aprovado na revisão.','ok')">✓ OK</button><button class="btn xs" onclick="toast('Comentário registrado para o autor de ${q.id}.','warn')">✎ Comentar</button><button class="btn xs danger" onclick="toast('${q.id} sinalizado para substituição.','crit')">⚠ Substituir</button></div></div>`).join('')}`,`<button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="closeModal();setProvaStatus('${id}','aprovada')">Concluir revisão e aprovar</button>`,'wide')}
// Wizard de nova prova
const NP={step:1,titulo:'',turma:'T8B',tipo:'Prova ordinária',itens:80,comps:['C01','C02','C10','C12'],dif:{facil:25,media:50,alta:25},versoes:2,sel:[]};
function novaProva(tid){NP.step=1;NP.turma=tid||'T8B';NP.titulo='Prova ordinária · 3º bimestre · '+TURMA[NP.turma].nome;NP.sel=[];renderNP()}
function renderNP(){const s=NP.step;const steps=['Matriz','Seleção','Revisão','Publicação'];const head=`<div class="steps">${steps.map((l,i)=>`<div class="st ${s===i+1?'on':s>i+1?'done':''}" onclick="NP.step=${i+1};renderNP()"><span class="n">${s>i+1?'✓':i+1}</span>${l}</div>${i<3?'<div class="sep"></div>':''}`).join('')}</div>`;
 let body='',foot='';
 if(s===1){const cps=compsForPer(TURMA[NP.turma].per);body=`<div class="grid g2"><div class="fld"><label>Título</label><input id="np-t" value="${NP.titulo}"></div><div class="fld"><label>Turma</label><select id="np-turma" onchange="NP.turma=this.value;NP.comps=[];renderNP()">${TURMAS.map(t=>`<option value="${t.id}" ${t.id===NP.turma?'selected':''}>${t.nome}</option>`).join('')}</select></div></div>
 <div class="grid g3"><div class="fld"><label>Tipo</label><select id="np-tipo"><option>Prova ordinária</option><option>Simulado ENAMED institucional</option><option>Avaliação de progresso</option><option>Somativa pré-internato</option><option>Lista de reteste (intervenção)</option></select></div><div class="fld"><label>Nº de itens</label><input type="number" id="np-n" value="${NP.itens}" onchange="NP.itens=+this.value"></div><div class="fld"><label>Versões (embaralhamento)</label><select id="np-v" onchange="NP.versoes=+this.value"><option ${NP.versoes===1?'selected':''}>1</option><option ${NP.versoes===2?'selected':''}>2</option><option ${NP.versoes===4?'selected':''}>4</option></select></div></div>
 <div class="fld"><label>Competências avaliadas (${NP.comps.length} selecionadas) — sugestão: lacunas da turma pré-marcadas</label><div class="chips">${cps.map(c=>{const r=turmaCompAvg(NP.turma,c.id,state.filters.aval);const weak=r&&r.m<55;if(NP.comps.length===0&&weak)NP.comps.push(c.id);return `<button class="chip ${NP.comps.includes(c.id)?'on':''}" onclick="toggleNPComp('${c.id}')">${c.id} ${c.nome.length>28?c.nome.slice(0,27)+'…':c.nome}${weak?' <span style="color:#FF6B6B">●</span>':''}</button>`}).join('')}</div></div>
 <div class="grid g3"><div class="fld"><label>Fácil (%)</label><input type="number" id="np-f" value="${NP.dif.facil}" onchange="NP.dif.facil=+this.value"></div><div class="fld"><label>Média (%)</label><input type="number" value="${NP.dif.media}" onchange="NP.dif.media=+this.value"></div><div class="fld"><label>Alta (%)</label><input type="number" value="${NP.dif.alta}" onchange="NP.dif.alta=+this.value"></div></div>
 <div class="callout teal"><span>✓</span><div class="small">Cota automática: itens distribuídos proporcionalmente entre as competências marcadas, respeitando a distribuição por área da Matriz de Referência quando o tipo for simulado.</div></div>`;
 foot=`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="NP.titulo=document.getElementById('np-t').value;NP.tipo=document.getElementById('np-tipo').value;if(!NP.comps.length){toast('Selecione ao menos uma competência.','warn');return}NP.step=2;autoSelect();renderNP()">Selecionar itens →</button>`}
 if(s===2){const pool=QUESTOES.filter(q=>NP.comps.includes(q.comp)&&q.status==='publicada');body=`<div class="row sb mb"><div class="small muted">${NP.sel.length} de ${NP.itens} itens selecionados · banco elegível: ${pool.length} publicados nestas competências (amostra do protótipo; banco completo ≈ ${fmt(Math.round(BANK.porStatus.publicada*NP.comps.length/COMPS.length))})</div><div class="row"><button class="btn sm" onclick="autoSelect();renderNP()">⟳ Seleção assistida</button><button class="btn sm" onclick="NP.sel=[];renderNP()">limpar</button></div></div>
 <div class="bar mb"><i style="width:${Math.min(100,100*NP.sel.length/NP.itens)}%"></i></div>
 <table class="tb"><tr><th></th><th>Item</th><th>Competência</th><th>Origem</th><th>Dific.</th><th class="num">p</th><th class="num">usos</th></tr>${pool.map(q=>`<tr><td><input type="checkbox" ${NP.sel.includes(q.id)?'checked':''} onchange="toggleSel('${q.id}')"></td><td><b class="mono small">${q.id}</b><span class="sub">${q.tema}${q.placeholder?' · <i>item demonstrativo</i>':''}</span></td><td class="small">${COMP[q.comp].nome}</td><td class="small muted">${ORIGEM[q.origem].nome.split(' (')[0]}</td><td><span class="badge b-mute">${q.dif}</span></td><td class="num">${q.p!=null?q.p.toFixed(2):'—'}</td><td class="num">${q.usos}</td></tr>`).join('')}</table>
 <p class="note mt8">A seleção assistida equilibra competência, dificuldade e evita itens já usados pela turma nos últimos 12 meses. ${NP.sel.length<NP.itens?`Faltam ${NP.itens-NP.sel.length} itens: no banco completo seriam preenchidos automaticamente; aqui a amostra é limitada.`:''}</p>`;
 foot=`<button class="btn" onclick="NP.step=1;renderNP()">← Matriz</button><button class="btn primary" onclick="NP.step=3;renderNP()">Revisar →</button>`}

 <div class="callout info mt"><span>ⓘ</span><div class="small">Checagens automáticas: nenhum item repetido na turma nos últimos 12 meses · cobertura de todas as competências marcadas · gabarito e comentário presentes em 100% · 2 itens com origem IA já aprovados por revisor humano.</div></div>`;
 foot=`<button class="btn" onclick="NP.step=2;renderNP()">← Seleção</button><button class="btn primary" onclick="NP.step=4;renderNP()">Enviar para revisão →</button>`}
 if(s===4){body=`<div class="empty" style="border-style:solid;border-color:rgba(0,194,168,.4)"><b>Pronta para publicar</b>Após a aprovação dos revisores, o caderno é congelado (versão 1), gerado em ${NP.versoes} versão(ões) embaralhada(s) e disponibilizado às turmas na data definida.</div><div class="grid g2 mt"><div class="fld"><label>Data de aplicação</label><input type="date" id="np-data" value="2026-11-16"></div><div class="fld"><label>Modalidade</label><select><option>Presencial com folha de respostas (leitura óptica)</option><option>Online na plataforma (navegador seguro)</option><option>Híbrida</option></select></div></div>`;
 foot=`<button class="btn" onclick="NP.step=3;renderNP()">← Revisão</button><button class="btn primary" onclick="saveProva()">Criar e enviar para revisão</button>`}
 openModal('Nova avaliação — '+steps[s-1],head+body,foot,'wide')}
